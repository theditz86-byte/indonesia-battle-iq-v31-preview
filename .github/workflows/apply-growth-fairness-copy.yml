name: Apply growth fairness copy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-growth-fairness-copy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch participant copy and share card typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, required=True):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  if required: raise SystemExit(f'missing pattern in {path}: {old}')
                  return
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Fix strict fetch HeadersInit typing in dynamic share card.
          rep(
            'components/result-share-card.tsx',
            'const token=getParticipantToken(), headers=token?{"X-Battle-Token":token}:{}',
            'const token=getParticipantToken(); const headers:Record<string,string>=token?{"X-Battle-Token":token}:{}'
          )

          # Payment positioning: paid credit is now Rematch / Practice, never pay-to-win.
          rep('app/payment/page.tsx','title:"Ranked Attempt Tambahan"','title:"Rematch / Practice Credit"')
          rep('app/payment/page.tsx','eyebrow:"Percobaan Tambahan"','eyebrow:"Rematch & Practice"')
          rep('app/payment/page.tsx','description:"1 percobaan kompetitif tambahan setelah 1 Ranked Attempt gratis habis."','description:"1 kredit Rematch / Practice setelah Ranked Attempt resmi gratis digunakan."')
          rep('app/payment/page.tsx','detail:"Hasil percobaan berbayar tetap kompetitif dan dapat memperbaiki skor terbaik serta posisi leaderboard resmi."','detail:"Rematch tetap menghasilkan Battle Point, analisis, dan riwayat perkembangan pribadi, tetapi tidak mengubah skor resmi leaderboard season."')
          rep('app/payment/page.tsx','"Ranked Attempt Tambahan"','"Rematch / Practice Credit"',False)
          rep('app/payment/page.tsx','"Mulai Ranked Attempt"','"Mulai Rematch"')
          rep('app/payment/page.tsx','"Kredit Ranked aktif setelah bukti disetujui."','"Kredit Rematch aktif setelah bukti disetujui."')
          rep('app/payment/page.tsx','Kredit Ranked tersedia','Kredit Rematch tersedia')

          # Account labels.
          rep('app/account/page.tsx','`Mulai Ranked · kredit ${paidCredits}x`','`Mulai Rematch · kredit ${paidCredits}x`')
          rep('app/account/page.tsx','"Buka Ranked · Rp5.000"','"Buka Rematch · Rp5.000"')
          rep('app/account/page.tsx','Berhasil masuk. Akun Battle IQ Anda sudah aktif.','Berhasil masuk. Akun Battle Point Anda sudah aktif.')
          rep('app/account/page.tsx','Pendaftaran berhasil. Anda mendapat kuota 1x percobaan gratis pada season ini.','Pendaftaran berhasil. Anda mendapat 1 Ranked Attempt resmi gratis pada season ini.')
          rep('app/account/page.tsx','Kredit Ranked','Kredit Rematch',False)

          # Test lobby and paid-rematch labels.
          rep('app/battle-test/page.tsx','Menyiapkan Battle IQ…','Menyiapkan Battle Point…')
          rep('app/battle-test/page.tsx','<b className="text-white">1 Ranked Attempt gratis</b> yang dapat masuk leaderboard resmi.','<b className="text-white">1 Ranked Attempt resmi gratis</b> yang menentukan leaderboard season.')
          rep('app/battle-test/page.tsx','Kredit Ranked','Kredit Rematch')
          rep('app/battle-test/page.tsx','Setelah 1 Ranked Attempt gratis habis, setiap kredit Rp5.000 membuka <b>Ranked Attempt tambahan</b>. Hasilnya tetap dapat memperbaiki skor terbaik dan <b>mempengaruhi leaderboard resmi</b>.','Setelah Ranked Attempt resmi digunakan, kredit Rp5.000 membuka <b>Rematch / Practice</b>. Hasilnya tetap mendapat Battle Point dan analisis pribadi, tetapi <b>tidak mengubah leaderboard resmi</b>.')
          rep('app/battle-test/page.tsx','Beli Ranked Attempt · Rp5.000','Buka Rematch · Rp5.000')
          rep('app/battle-test/page.tsx','"PAID RANKED ATTEMPT"','"REMATCH / PRACTICE"')
          rep('app/battle-test/page.tsx','Ranked Attempt berbayar — hasil tes ini dapat memperbaiki skor terbaik dan posisi leaderboard resmi.','Rematch / Practice — hasil tes ini tersimpan untuk analisis dan perkembangan pribadi, tetapi tidak mengubah leaderboard resmi.')
          rep('app/battle-test/page.tsx','setError(data?.error || "Ranked Attempt gratis season ini sudah digunakan.")','setError("Ranked Attempt resmi season ini sudah digunakan. Gunakan Rematch / Practice Credit untuk latihan dan analisis tambahan tanpa mengubah leaderboard.")')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/result-share-card.tsx app/payment/page.tsx app/account/page.tsx app/battle-test/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize fair rematches and share-card build"
          git push origin HEAD:main
