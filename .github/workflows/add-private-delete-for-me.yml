name: Add Private Delete For Me

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-private-delete-for-me.yml"

permissions:
  contents: write

jobs:
  patch-private-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add delete-for-me UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/private-messages.tsx")
          text = path.read_text(encoding="utf-8")

          old_import = 'import { Check, CheckCheck, Clock3, Lock, MessageCircle, Send, UserCheck, UserPlus, Users, X } from "lucide-react"'
          new_import = 'import { Check, CheckCheck, Clock3, Lock, MessageCircle, Send, Trash2, UserCheck, UserPlus, Users, X } from "lucide-react"'
          if old_import not in text:
              raise SystemExit("lucide import not found")
          text = text.replace(old_import, new_import, 1)

          old_state = '  const [threadError, setThreadError] = useState("")\n'
          new_state = old_state + '  const [deletingMessageId, setDeletingMessageId] = useState<number | null>(null)\n'
          if old_state not in text:
              raise SystemExit("thread error state not found")
          text = text.replace(old_state, new_state, 1)

          marker = '  async function send(event: FormEvent) {'
          if marker not in text:
              raise SystemExit("send marker not found")
          delete_fn = '''  async function deleteForMe(message: PrivateMessage) {
    if (!selectedId || deletingMessageId !== null) return
    if (!window.confirm("Hapus pesan ini hanya dari tampilan Anda? Pesan tetap terlihat untuk lawan chat.")) return
    setDeletingMessageId(message.id)
    try {
      const data = await socialCall<ThreadResponse>("delete_for_me", {
        conversation_id: selectedId,
        message_id: message.id,
      })
      applyThread(data)
      setThreadError("")
      void loadOverview(true)
    } catch (err) {
      setThreadError(err instanceof Error ? err.message : "Pesan belum dapat dihapus untuk Anda.")
    } finally {
      setDeletingMessageId(null)
    }
  }

'''
          text = text.replace(marker, delete_fn + marker, 1)

          old_tail = '</div></div></div> })}<div ref={endRef} />'
          new_tail = '''</div><button type="button" disabled={deletingMessageId !== null} onClick={() => void deleteForMe(message)} title="Hapus hanya untuk saya" className={`mt-1.5 inline-flex items-center gap-1 text-[10px] transition-colors disabled:opacity-40 ${message.is_own ? "text-indigo-200/55 hover:text-rose-200" : "text-slate-600 hover:text-rose-300"}`}><Trash2 className="h-3 w-3" />{deletingMessageId === message.id ? "Menghapus…" : "Hapus untuk saya"}</button></div></div> })}<div ref={endRef} />'''
          if old_tail not in text:
              raise SystemExit("message render tail not found")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit delete-for-me UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/private-messages.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add private message delete for me"
          git push
