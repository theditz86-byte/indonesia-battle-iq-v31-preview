name: Finalize private rematch labels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finalize-private-rematch-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch private result labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing {old} in {path}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          rep('app/account/results/page.tsx','`Mulai Ranked · kredit ${paidCredits}x`','`Mulai Rematch · kredit ${paidCredits}x`')
          rep('app/account/results/page.tsx','"Tambah Ranked · Rp5.000"','"Buka Rematch · Rp5.000"')
          rep('app/account/results/page.tsx','Kredit Ranked','Kredit Rematch')
          rep('app/account/results/page.tsx','paid?"Ranked berbayar":"Ranked gratis"','paid?"Rematch / Practice":"Ranked resmi"')
          rep('app/account/results/page.tsx','<p className="mt-1 text-sm text-slate-500">Tambah percobaan kompetitif setelah kuota gratis habis.</p>','<p className="mt-1 text-sm text-slate-500">Tambah Rematch / Practice untuk latihan dan analisis tanpa mengubah leaderboard resmi.</p>')
          rep('app/account/results/page.tsx','(participant?.nickname||"IQ")','(participant?.nickname||"BP")')

          rep('app/result/page.tsx','{paid?"· Berbayar":"· Gratis"}','{paid?"· Rematch / Practice":"· Ranked Resmi"}')
          rep('app/result/page.tsx','<span className="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-bold text-slate-300">{"Ranked Result"}</span>','<span className="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-bold text-slate-300">{result.ranked_attempt ? "Ranked Resmi" : "Rematch / Practice"}</span>')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/account/results/page.tsx app/result/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Label paid attempts as private rematches"
          git push origin HEAD:main
