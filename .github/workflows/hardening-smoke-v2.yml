name: ALZAVA Hardening Smoke V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hardening-smoke-v2.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Final source hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("app/battle-test/page.tsx")
          s=p.read_text()
          s=s.replace('  high_range_unlocked?: boolean\n  core_answers?: Array<number | null> | null\n','')
          s=re.sub(r'\nasync function callBattle\(body: Record<string, unknown>, token: string\) \{.*?\n\}\n\nasync function callRankedStart', '\nasync function callRankedStart', s, count=1, flags=re.S)
          block=re.search(r'  async function finishStage\(force = false\) \{.*?\n  \}\n\n  if \(phase === "loading"\)',s,re.S)
          if not block: raise SystemExit("finishStage anchor missing")
          simple='''  async function finishStage(force = false) {\n    if (!attempt || phase === "submitting") return\n    const payload = answersRef.current\n    if (payload.length !== 20) {\n      setError("Format Ranked tidak valid. Muat ulang arena sebelum melanjutkan.")\n      return\n    }\n    const missing = payload.filter((a) => a === null).length\n    if (!force && missing > 0 && !window.confirm(`Masih ada ${missing} soal belum dijawab. Tetap lanjut?`)) return\n    await sendSubmit(payload)\n  }\n\n  if (phase === "loading")'''
          s=s[:block.start()]+simple+s[block.end():]
          s=s.replace('  const [stageNotice,setStageNotice] = useState("")\n','')
          s=s.replace('          <div><p className="text-xs font-black text-cyan-300">{attempt.high_range_unlocked ? "HIGH RANGE · VERIFIED PATH" : isRepeatRanked ? "RANKED ATTEMPT · BEST SCORE CHASE" : "RANKED ATTEMPT"}</p><p className="text-sm font-bold text-white">Percobaan #{attempt.attempt_number} dari 3{attempt.questions.length===20 ? " · 20 soal · 20 menit" : attempt.high_range_unlocked ? " · Tahap 2/2" : " · Tahap 1/2"}</p></div>',
                      '          <div><p className="text-xs font-black text-cyan-300">{isRepeatRanked ? "RANKED ATTEMPT · BEST SCORE CHASE" : "RANKED ATTEMPT"}</p><p className="text-sm font-bold text-white">Percobaan #{attempt.attempt_number} dari 3 · 20 soal · 20 menit</p></div>')
          s=s.replace('        {stageNotice && <div className="mb-5 rounded-2xl border border-violet-300/30 bg-violet-500/15 px-4 py-3 text-sm font-semibold leading-6 text-violet-100">{stageNotice}</div>}\n','')
          s=s.replace('        <div className="mb-5 rounded-2xl border border-cyan-300/15 bg-cyan-400/[.06] px-4 py-3 text-xs font-semibold leading-5 text-cyan-100">{attempt.high_range_unlocked ? "High Range: 10 soal tambahan · 8 menit · skor rentang atas sedang diverifikasi." : attempt.questions.length===20 ? "Fair Play: 20 soal · 20 menit · jawaban tersimpan otomatis. Jika tes ditinggalkan sebelum selesai, jawaban yang sudah tersimpan akan tetap dinilai saat waktu berakhir." : "Fair Play: 30 soal · 15 menit · kerjakan tanpa AI generatif, mesin pencari, kalkulator, atau bantuan orang lain."}</div>',
                      '        <div className="mb-5 rounded-2xl border border-cyan-300/15 bg-cyan-400/[.06] px-4 py-3 text-xs font-semibold leading-5 text-cyan-100">Fair Play: 20 soal · 20 menit · jawaban tersimpan otomatis. Jika tes ditinggalkan sebelum selesai, jawaban yang sudah tersimpan akan tetap dinilai saat waktu berakhir.</div>')
          s=s.replace('{attempt.questions.length===30 ? "Periksa High Range" : "Kirim Hasil Final"}','Kirim Hasil Final')
          s=s.replace('className={`h-9 rounded-lg text-xs font-black ${i===index ? (i>=30 ? "bg-violet-500 text-white ring-2 ring-violet-300/40" : "bg-indigo-500 text-white ring-2 ring-indigo-300/40") : answers[i]!==null ? "bg-emerald-500/20 text-emerald-200" : i>=30 ? "bg-violet-950/70 text-violet-300" : "bg-slate-900 text-slate-500"}`}',
                      'className={`h-9 rounded-lg text-xs font-black ${i===index ? "bg-indigo-500 text-white ring-2 ring-indigo-300/40" : answers[i]!==null ? "bg-emerald-500/20 text-emerald-200" : "bg-slate-900 text-slate-500"}`}')
          s=s.replace('{attempt.questions.length===20 ? "Kirim Hasil" : attempt.questions.length===30 ? "Selesai Inti" : "Selesai High Range"}','Kirim Hasil')
          if re.search(r'high_range|High Range|Selesai Inti|Tahap 2/2',s,re.I):
              hits=[line.strip() for line in s.splitlines() if re.search(r'high_range|High Range|Selesai Inti|Tahap 2/2',line,re.I)]
              raise SystemExit("legacy Ranked refs remain: "+" || ".join(hits[:6]))
          p.write_text(s)

          Path("tests/authenticated-smoke.mjs").write_text('''import { chromium } from "playwright"\nconst token=process.env.ALZAVA_E2E_TOKEN||""\nif(!token){console.log("authenticated smoke skipped: ALZAVA_E2E_TOKEN is not configured");process.exit(0)}\nconst base="http://127.0.0.1:4173"\nconst browser=await chromium.launch({headless:true})\nconst context=await browser.newContext({viewport:{width:390,height:844}})\nconst page=await context.newPage();const errors=[]\npage.on("pageerror",e=>errors.push(String(e)))\nawait page.goto(base+"/battle/",{waitUntil:"domcontentloaded"})\nawait page.evaluate((value)=>localStorage.setItem("indonesia-battle-iq.participant-token.v1",value),token)\nfor(const route of ["/battle/","/battle-test/","/messages/","/global-chat/","/latihan-tiu/","/pvp/"]){const r=await page.goto(base+route,{waitUntil:"domcontentloaded",timeout:25000});await page.waitForTimeout(800);if(!r||r.status()>=400)throw new Error(`${route} HTTP ${r?.status()}`);const body=(await page.locator("body").innerText()).trim();if(body.length<20)throw new Error(`${route} rendered empty`)}\nawait browser.close();if(errors.length)throw new Error(`authenticated browser errors: ${errors.join(" | ")}`);console.log("authenticated smoke ok")\n''')

          wp=Path(".github/workflows/web-smoke.yml")
          w=wp.read_text()
          anchor='          node tests/browser-smoke.mjs\n'
          if 'authenticated-smoke.mjs' not in w:
              if anchor not in w: raise SystemExit("web-smoke anchor missing")
              w=w.replace(anchor,anchor+'          ALZAVA_E2E_TOKEN="${{ secrets.ALZAVA_E2E_TOKEN }}" node tests/authenticated-smoke.mjs\n',1)
          wp.write_text(w)
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke mobile and desktop
        run: |
          python3 -m http.server 4173 -d out >/tmp/alzava-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          ALZAVA_E2E_TOKEN="${{ secrets.ALZAVA_E2E_TOKEN }}" node tests/authenticated-smoke.mjs
      - name: Commit and clean temporary workflows
        run: |
          git config user.name "alzava-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hardening-v1.yml .github/workflows/hardening-smoke.yml .github/workflows/hardening-smoke-v2.yml
          git add app tests .github/workflows/web-smoke.yml
          git commit -m "fix: complete ALZAVA error hardening and QA"
          git push
