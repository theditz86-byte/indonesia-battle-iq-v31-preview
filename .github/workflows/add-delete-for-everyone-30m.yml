name: Add Delete For Everyone 30m

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-delete-for-everyone-30m.yml"

permissions:
  contents: write

jobs:
  patch-private-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch private messages
        run: python .github/scripts/patch-delete-for-everyone.py
      - name: Commit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/private-messages.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add 30-minute delete for everyone"
          git push
