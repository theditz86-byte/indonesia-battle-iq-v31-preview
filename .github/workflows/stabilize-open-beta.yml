name: Stabilize Open Beta

on:
  push:
    branches: [main]
    paths:
      - scripts/stabilize-open-beta.mjs
      - .github/workflows/stabilize-open-beta.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source stabilization
        run: node scripts/stabilize-open-beta.mjs
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full quality gate
        run: npm run check
      - name: Commit stabilized source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components package.json package-lock.json tests
          git commit -m "fix: stabilize Open Beta ranked TIU and payments"
          git push origin HEAD:main
