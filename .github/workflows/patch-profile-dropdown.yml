name: Patch Profile Dropdown

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-profile-dropdown.yml"

permissions:
  contents: write

jobs:
  patch-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch controlled profile dropdown
        run: python .github/scripts/patch-profile-dropdown.py
      - name: Commit navbar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/site-navbar.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix profile dropdown menu"
          git push
