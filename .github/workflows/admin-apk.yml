name: Build ALZAVA Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "admin-mobile/**"
      - ".github/workflows/admin-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install base dependencies
        working-directory: admin-mobile
        run: npm install

      - name: Install SecureStore for current Expo SDK
        working-directory: admin-mobile
        run: npx expo install expo-secure-store

      - name: Generate native Android project
        working-directory: admin-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone installable APK
        working-directory: admin-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find admin-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" ALZAVA-Battle-IQ-Admin-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALZAVA-Battle-IQ-Admin-v1
          path: ALZAVA-Battle-IQ-Admin-v1.apk
          if-no-files-found: error
          retention-days: 30
