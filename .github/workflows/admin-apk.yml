name: Build ALZAVA Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "admin-mobile/**"
      - ".github/workflows/admin-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install JavaScript dependencies
        working-directory: admin-mobile
        run: |
          npm install
          npx expo install expo-secure-store
          npx expo-doctor

      - name: Generate native Android project
        working-directory: admin-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable APK
        working-directory: admin-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp admin-mobile/android/app/build/outputs/apk/debug/app-debug.apk ALZAVA-Battle-IQ-Admin-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALZAVA-Battle-IQ-Admin-v1
          path: ALZAVA-Battle-IQ-Admin-v1.apk
          if-no-files-found: error
          retention-days: 30
