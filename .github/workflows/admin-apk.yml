name: Build ALZAVA Battle Point Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "admin-mobile/**"
      - "public/alzava-emblem-v3.svg"
      - ".github/workflows/admin-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate ALZAVA app and notification icons
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin imagemagick espeak-ng sox
          mkdir -p admin-mobile/assets /tmp/alzava-icon
          rsvg-convert -w 680 -h 680 public/alzava-emblem-v3.svg -o /tmp/alzava-icon/logo-680.png
          convert -size 1024x1024 xc:none /tmp/alzava-icon/logo-680.png -gravity center -composite admin-mobile/assets/adaptive-foreground.png
          convert -size 1024x1024 xc:'#020817' /tmp/alzava-icon/logo-680.png -gravity center -composite admin-mobile/assets/app-icon.png
          cp admin-mobile/assets/adaptive-foreground.png admin-mobile/assets/alzava-logo.png
          rsvg-convert -w 78 -h 78 public/alzava-emblem-v3.svg -o /tmp/alzava-icon/notif-base.png
          convert /tmp/alzava-icon/notif-base.png -channel RGB -fill white -colorize 100 admin-mobile/assets/notification-icon.png
          identify admin-mobile/assets/app-icon.png admin-mobile/assets/adaptive-foreground.png admin-mobile/assets/alzava-logo.png admin-mobile/assets/notification-icon.png

      - name: Generate futuristic spoken payment alert
        shell: bash
        run: |
          python - <<'PY'
          import math, struct, wave
          from pathlib import Path

          out = Path('/tmp/alzava_intro.wav')
          rate = 44100
          samples = []

          duration = 0.34
          count = int(rate * duration)
          for i in range(count):
              t = i / rate
              progress = i / max(1, count - 1)
              freq = 520 + (1480 - 520) * progress
              env = min(1.0, i / max(1, int(rate * 0.012))) * min(1.0, (count - i) / max(1, int(rate * 0.055)))
              carrier = math.sin(2 * math.pi * freq * t)
              shimmer = 0.25 * math.sin(2 * math.pi * freq * 2.0 * t)
              samples.append(0.55 * env * (carrier + shimmer) / 1.25)

          for freq, duration, amp in [(1318.51, 0.10, 0.55), (1760.00, 0.15, 0.68)]:
              count = int(rate * duration)
              for i in range(count):
                  t = i / rate
                  env = min(1.0, i / max(1, int(rate * 0.008))) * min(1.0, (count - i) / max(1, int(rate * 0.035)))
                  samples.append(amp * env * math.sin(2 * math.pi * freq * t))
              samples.extend([0.0] * int(rate * 0.035))

          with wave.open(str(out), 'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              wav.writeframes(b''.join(struct.pack('<h', int(max(-1.0, min(1.0, s)) * 32767)) for s in samples))
          PY

          espeak-ng -v id -s 150 -p 52 -a 175 -w /tmp/alzava_voice.wav "Bukti bayar masuk"
          sox /tmp/alzava_voice.wav -r 44100 -c 1 -b 16 /tmp/alzava_voice_44.wav gain -n -3 highpass 120 lowpass 7600
          sox /tmp/alzava_intro.wav /tmp/alzava_voice_44.wav admin-mobile/assets/alzava_payment.wav
          soxi admin-mobile/assets/alzava_payment.wav

      - name: Install base dependencies
        working-directory: admin-mobile
        run: npm install

      - name: Install Expo native modules for current SDK
        working-directory: admin-mobile
        run: npx expo install expo-secure-store expo-notifications

      - name: Apply fast payment notification behavior
        shell: bash
        run: python admin-mobile/apply-notification-patch.py

      - name: Apply persistent admin session behavior
        shell: bash
        run: python admin-mobile/apply-session-reliability-patch.py

      - name: Generate native Android project
        working-directory: admin-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone installable APK
        working-directory: admin-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find admin-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" ALZAVA-Battle-Point-Admin-v1.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALZAVA-Battle-Point-Admin-v1.5
          path: ALZAVA-Battle-Point-Admin-v1.5.apk
          if-no-files-found: error
          retention-days: 30
