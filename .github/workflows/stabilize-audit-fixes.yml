name: Stabilize ALZAVA audit fixes

on:
  push:
    paths:
      - '.github/workflows/stabilize-audit-fixes.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Apply stabilization patch
        run: python3 scripts/stabilize-audit-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Test, typecheck, and build
        run: npm run check
      - name: Commit stabilized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components tests
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: stabilize ranked rules, open beta copy, and season controls'
          git push
