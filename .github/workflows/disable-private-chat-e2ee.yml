name: Disable E2EE For New Private Messages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/disable-private-chat-e2ee.yml"

permissions:
  contents: write

jobs:
  patch-private-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch new private messages to plaintext
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/private-messages.tsx")
          text = path.read_text(encoding="utf-8")

          # New messages no longer need the encryption helper.
          text = text.replace("  encryptPrivateMessage,\n", "")

          # Always send new private messages through the normal plaintext action.
          pattern = re.compile(
              r"  const secureActive = Boolean\(secureDevice && \(secureDirectory\?\.other_devices\?\.length \|\| 0\) > 0\)\n\n"
              r"  async function send\(event: FormEvent\) \{.*?\n  \}\n\n  if \(!participant\) \{",
              re.S,
          )
          replacement = '''  async function send(event: FormEvent) {
            event.preventDefault()
            const text = draft.trim()
            if (!text || !selectedId || sending) return
            setSending(true)
            try {
              const data = await socialCall<ThreadResponse>("send_message", {
                conversation_id: selectedId,
                message: text,
              })
              applyThread(data)
              setDraft("")
              void loadOverview(true)
            } catch (err) {
              setThreadError(err instanceof Error ? err.message : "Pesan belum dapat dikirim.")
            } finally {
              setSending(false)
            }
          }

          if (!participant) {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"send block patch failed: {count}")

          # Remove E2EE-active banner. Legacy encrypted messages remain decryptable/readable.
          text, banner_count = re.subn(
              r'\n\s*\{secureActive && <div className="mx-4 mt-4.*?</div>\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if banner_count != 1:
              raise SystemExit(f"secure banner patch failed: {banner_count}")

          # Remove automatic secure-chat hint from the composer.
          text, hint_count = re.subn(
              r'\{secureError && !secureActive && <p className="mb-2 text-\[10px\] text-slate-600">Secure chat akan aktif otomatis saat perangkat mendukung dan kedua peserta sudah siap\.</p>\}',
              '',
              text,
              count=1,
          )
          if hint_count != 1:
              raise SystemExit(f"secure hint patch failed: {hint_count}")

          # Remove E2EE status text from the input footer.
          old_label = '{secureActive ? "🔒 E2EE aktif · " : ""}Enter kirim · Alt + Enter baris baru'
          if old_label not in text:
              raise SystemExit("secure composer label not found")
          text = text.replace(old_label, 'Enter kirim · Alt + Enter baris baru', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit plaintext private chat
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/private-messages.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Disable E2EE for new private messages"
          git push
