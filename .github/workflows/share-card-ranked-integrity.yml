name: Share card ranked integrity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/share-card-ranked-integrity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep Rematch share cards non-ranked
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          rep('components/result-share-card.tsx','  submittedAt?: string\n}', '  submittedAt?: string\n  rankedAttempt?: boolean\n}')
          rep('components/result-share-card.tsx','  const profile=await getProfile(); const ranks=await getRanks(props,profile)', '  const profile=await getProfile(); const official=props.rankedAttempt !== false; const ranks=official?await getRanks(props,profile):{}')
          rep('components/result-share-card.tsx','  const topPercent=props.nationalRank&&props.leaderboardTotal?Math.max(1,Math.ceil((props.nationalRank/props.leaderboardTotal)*100)):null;const localRank=ranks.regency||ranks.district||ranks.province;const localLabel=ranks.regency?`Kab. ${props.regencyName||""}`:ranks.district?(props.districtName||"Kecamatan"):ranks.province?(props.provinceName||"Provinsi"):"Wilayah";const nationalLabel=props.nationalRank?`#${props.nationalRank}`:topPercent?`Top ${topPercent}%`:"Top —"', '  const topPercent=official&&props.nationalRank&&props.leaderboardTotal?Math.max(1,Math.ceil((props.nationalRank/props.leaderboardTotal)*100)):null;const localRank=official?(ranks.regency||ranks.district||ranks.province):undefined;const localLabel=ranks.regency?`Kab. ${props.regencyName||""}`:ranks.district?(props.districtName||"Kecamatan"):ranks.province?(props.provinceName||"Provinsi"):"Wilayah";const nationalLabel=official&&props.nationalRank?`#${props.nationalRank}`:topPercent?`Top ${topPercent}%`:"Top —"')
          rep('components/result-share-card.tsx','panel(ctx,start+(cardW+gap),y,cardW,"🏆",localRank?`#${localRank}`:"#—",localLabel,"#fbbf24");panel(ctx,start+(cardW+gap)*2,y,cardW,"↗",nationalLabel,topPercent?`Top ${topPercent}% Indonesia`:"Peringkat Indonesia","#a78bfa")', 'panel(ctx,start+(cardW+gap),y,cardW,"🏆",official?(localRank?`#${localRank}`:"#—"):"REMATCH",official?localLabel:"Practice","#fbbf24");panel(ctx,start+(cardW+gap)*2,y,cardW,"↗",official?nationalLabel:"NON-RANKED",official?(topPercent?`Top ${topPercent}% Indonesia`:"Peringkat Indonesia"):"Tidak ubah klasemen","#a78bfa")')
          rep('components/result-share-card.tsx','const text=`Saya meraih ${Number(props.battlePoint).toLocaleString("id-ID")} Battle Point di ALZAVA. Bisa lewati skorku? ⚔️`;', 'const text=props.rankedAttempt===false?`Saya meraih ${Number(props.battlePoint).toLocaleString("id-ID")} Battle Point di Rematch ALZAVA. Bisa lewati skorku? ⚔️`:`Saya meraih ${Number(props.battlePoint).toLocaleString("id-ID")} Battle Point resmi di ALZAVA. Bisa lewati skorku? ⚔️`;')
          rep('app/result/page.tsx','              submittedAt={result.submitted_at}\n            />', '              submittedAt={result.submitted_at}\n              rankedAttempt={result.ranked_attempt !== false}\n            />')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/result-share-card.tsx app/result/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep Rematch share cards non-ranked"
          git pull --rebase origin main
          git push origin HEAD:main
