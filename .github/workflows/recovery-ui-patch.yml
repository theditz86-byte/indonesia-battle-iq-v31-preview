name: Recovery UI Patch
on:
  push:
    paths:
      - '.ops/recovery_ui_patch.py'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply recovery UI patch
        run: python .ops/recovery_ui_patch.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "ALZAVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/account/page.tsx app/admin/page.tsx app/reset-password/page.tsx app/page.tsx components/admin-recovery-controls.tsx components/recovery-redirect.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add email recovery and forgot password flows"
          git pull --rebase origin main
          git push origin HEAD:main