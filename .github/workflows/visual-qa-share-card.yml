name: Visual QA share cards
on:
  workflow_dispatch:
  push:
    paths:
      - "components/result-share-card.tsx"
      - ".github/workflows/visual-qa-share-card.yml"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create temporary local QA lab
        shell: bash
        run: |
          mkdir -p app/share-card-lab
          cat > app/share-card-lab/page.tsx <<'EOF'
          "use client"
          import { useEffect, useState } from "react"
          import ResultShareCard from "@/components/result-share-card"
          const avatar="https://efndozplpwyemzgqfnep.supabase.co/storage/v1/object/public/battle-avatars/3cd238c2-234d-4a3c-a1b0-747ebddb839b/profile.png?v=1790252164030"
          export default function ShareCardLab(){
            const [mode,setMode]=useState<"ranked"|"rematch"|null>(null)
            useEffect(()=>{setMode(new URLSearchParams(window.location.search).get("mode")==="rematch"?"rematch":"ranked")},[])
            if(!mode)return <main className="grid min-h-screen place-items-center bg-slate-950 text-slate-400">Menyiapkan QA…</main>
            const ranked=mode==="ranked"
            return <main className="min-h-screen bg-slate-950 p-6 text-white"><div className="mx-auto max-w-xl"><ResultShareCard nickname="Aditakaa" participantPublicId="3cd238c2-234d-4a3c-a1b0-747ebddb839b" battlePoint={ranked?825:895} correctCount={ranked?33:50} questionCount={ranked?40:55} durationMs={ranked?937691:1722000} nationalRank={ranked?1:undefined} leaderboardTotal={7} provinceName="Jawa Timur" regencyName="Kab. Sumenep" districtName="Kota Sumenep" submittedAt="2026-09-21T05:09:00+07:00" rankedAttempt={ranked} autoOpen debugQa demoProfile={{avatar_url:avatar,province_code:"35",province_name:"Jawa Timur",regency_name:"Kab. Sumenep",district_name:"Kota Sumenep"}}/></div></main>
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Start local Next app
        shell: bash
        run: |
          (npx next dev -H 127.0.0.1 -p 3000 > /tmp/alzava-next.log 2>&1 &)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/share-card-lab/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alzava-next.log
          exit 1
      - name: Capture ranked and rematch previews
        shell: bash
        run: |
          mkdir -p qa-out
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=500,1450 --virtual-time-budget=9000 --screenshot=qa-out/share-card-ranked.png 'http://127.0.0.1:3000/share-card-lab/?mode=ranked'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=500,1450 --virtual-time-budget=9000 --screenshot=qa-out/share-card-rematch.png 'http://127.0.0.1:3000/share-card-lab/?mode=rematch'
      - uses: actions/upload-artifact@v4
        with:
          name: share-card-visual-qa
          path: |
            qa-out/share-card-ranked.png
            qa-out/share-card-rematch.png
          retention-days: 1
