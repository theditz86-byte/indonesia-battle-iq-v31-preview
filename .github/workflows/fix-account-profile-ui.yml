name: Fix account profile UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-account-profile-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch profile UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          account = Path('app/account/page.tsx')
          s = account.read_text()

          old_inline = '{participant.avatar_url && <button type="button" onClick={()=>void removeAvatar()} disabled={busy} className="rounded-xl border border-rose-300/25 bg-rose-500/10 px-5 py-3 font-black text-rose-200 hover:bg-rose-500/15 disabled:opacity-60">Hapus Foto Profil</button>}'
          if old_inline not in s:
              raise SystemExit('inline delete button pattern not found')
          s = s.replace(old_inline, '', 1)

          old_file = '<input type="file" accept="image/jpeg,image/png,image/webp" disabled={busy} onChange={(e) => void uploadAvatar(e.target.files?.[0])} className={fieldClass} /></label>'
          new_file = '<input type="file" accept="image/jpeg,image/png,image/webp" disabled={busy} onChange={(e) => void uploadAvatar(e.target.files?.[0])} className={fieldClass} /></label>{notice.startsWith("Foto profil") && <div role="status" className="rounded-xl border border-emerald-300/30 bg-emerald-400/10 px-4 py-3 text-sm font-bold text-emerald-100 shadow-[0_0_20px_rgba(52,211,153,.10)]">✓ {notice}</div>}'
          if old_file not in s:
              raise SystemExit('avatar file input pattern not found')
          s = s.replace(old_file, new_file, 1)
          account.write_text(s)

          corner = Path('components/global-profile-corner.tsx')
          c = corner.read_text()
          old_corner = 'className="fixed right-3 top-3 z-[90] flex items-center gap-2 sm:right-5"'
          new_corner = 'className="fixed right-6 top-3 z-[90] flex items-center gap-2 sm:right-8 lg:right-12"'
          if old_corner not in c:
              raise SystemExit('global profile corner class pattern not found')
          c = c.replace(old_corner, new_corner, 1)
          corner.write_text(c)
          PY
      - name: Verify build
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit patch and remove workflow
        run: |
          git config user.name "alzava-bot"
          git config user.email "alzava-bot@users.noreply.github.com"
          git rm .github/workflows/fix-account-profile-ui.yml
          git add app/account/page.tsx components/global-profile-corner.tsx
          git commit -m "fix account profile controls and upload feedback"
          git push
