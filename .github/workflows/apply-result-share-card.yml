name: Apply ALZAVA Result Share Card

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-result-share-card.py"

permissions:
  contents: write

jobs:
  apply-share-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply result page patch
        run: python scripts/apply-result-share-card.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install

      - name: Build verification
        run: npm run build

      - name: Commit result page integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/result/page.tsx
          git commit -m "Wire dynamic Battle Point share card into result page"
          git push
