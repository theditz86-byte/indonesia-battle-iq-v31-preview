name: Finalize ALZAVA Battle Point rebrand

on:
  push:
    paths:
      - '.github/workflows/rebrand-battle-point.yml'

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe Battle Point copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('components'), Path('public'), Path('README.md')]
          allowed = {'.tsx', '.ts', '.jsx', '.js', '.mjs', '.md', '.xml', '.txt', '.svg'}

          replacements = [
              ('ALZAVA Battle IQ', 'ALZAVA Battle Point'),
              ('alzava-battle-iq.pages.dev', 'alzava-battle-point.pages.dev'),
              ('Nama peserta Battle IQ', 'Nama peserta Battle Point'),
              ('akun Battle IQ Anda', 'akun Battle Point Anda'),
              ('Battle IQ</span>', 'Battle Point</span>'),
              ('Battle Score', 'Battle Point'),
              ('Memuat hasil Battle IQ…', 'Memuat hasil…'),
              ('Memuat hasil Battle IQ...', 'Memuat hasil...'),
              ('ALZ-BIQ-', 'ALZ-BP-'),
              ('Mulai Battle IQ', 'Mulai Battle Point'),
          ]

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in allowed)

          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if path.as_posix() == 'app/account/page.tsx':
                  text = text.replace('(participant.nickname || "IQ")', '(participant.nickname || "BP")')
                  text = text.replace('Math.min(1, used)}/2', 'Math.min(1, used)}/1')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/rebrand-battle-point.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit rebrand sweep
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No additional rebrand changes needed."
            exit 0
          fi
          git commit -m "Finalize ALZAVA Battle Point rebrand"
          git push
