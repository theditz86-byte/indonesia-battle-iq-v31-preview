name: Remove redundant Open Beta panels
on:
  push:
    paths:
      - '.github/workflows/remove-redundant-open-beta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch redundant UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hero = Path('components/hero.tsx')
          s = hero.read_text()
          old = '''            <div className="rounded-2xl border border-violet-300/20 bg-gradient-to-r from-violet-500/10 via-indigo-500/10 to-cyan-500/10 px-4 py-3 shadow-[0_0_22px_rgba(99,102,241,.10)] backdrop-blur-sm">\n              <div className="text-[12px] font-black leading-5 text-white">\n                <span className="text-emerald-300">OPEN BETA GRATIS</span>\n                <span className="text-slate-500"> · </span>\n                3 Ranked bebas dipakai kapan saja\n              </div>\n              <div className="mt-0.5 text-[11px] font-bold leading-4 text-cyan-100/70">Skor terbaik otomatis masuk leaderboard.</div>\n            </div>\n\n'''
          if old not in s:
              raise SystemExit('hero Open Beta panel not found')
          hero.write_text(s.replace(old, ''))

          page = Path('app/battle-test/page.tsx')
          s = page.read_text()
          old = '''            <div className="mt-5 rounded-2xl border border-amber-300/20 bg-amber-300/10 p-4 text-sm leading-6 text-amber-100">\n              <b>Open Beta GRATIS.</b> Semua pemain mendapat maksimal 3 Ranked Battle resmi pada season mingguan yang sama. Tidak ada pembelian Ranked tambahan. Ketiga kesempatan langsung tersedia dan bebas dipakai kapan saja selama season aktif, termasuk di hari yang sama.\n            </div>\n'''
          if old not in s:
              raise SystemExit('battle-test yellow Open Beta panel not found')
          s = s.replace(old, '')
          old_checkbox = '''              Saya akan mengerjakan sendiri tanpa AI generatif, kalkulator, pencarian web, atau bantuan lain.\n'''
          new_checkbox = '''              Saya memahami dan menyetujui Aturan Fair Play di atas.\n'''
          if old_checkbox not in s:
              raise SystemExit('Fair Play checkbox copy not found')
          page.write_text(s.replace(old_checkbox, new_checkbox))
          PY
      - name: Verify
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit clean UI and remove workflow
        run: |
          rm .github/workflows/remove-redundant-open-beta.yml
          git config user.name 'alzava-bot'
          git config user.email 'alzava-bot@users.noreply.github.com'
          git add components/hero.tsx app/battle-test/page.tsx .github/workflows/remove-redundant-open-beta.yml
          git commit -m 'simplify Open Beta and Fair Play UI'
          git push
