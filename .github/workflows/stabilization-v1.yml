name: ALZAVA Stabilization V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilization-v1.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stabilization patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s):
              Path(p).parent.mkdir(parents=True,exist_ok=True)
              Path(p).write_text(s)
          def rep(s,old,new,label):
              if old not in s: raise SystemExit(f'missing pattern: {label}')
              return s.replace(old,new,1)

          # Account: 3 official Ranked, resilient sessions, cached region API, verified recovery email, logout/delete.
          p='app/account/page.tsx'; s=read(p)
          s=rep(s,
          'const ACCOUNT_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-account"\nconst RECOVERY_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-recovery"',
          'const ACCOUNT_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-account"\nconst REGION_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-regions"\nconst RECOVERY_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-recovery"\nconst SESSION_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-participant-session"\nconst DELETE_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-account-delete"', 'account constants')
          s=s.replace('  email_configured?: boolean\n', '  email_configured?: boolean\n  email_verified?: boolean\n')
          s=rep(s,
          '  const [claimPassword, setClaimPassword] = useState("")',
          '  const [claimPassword, setClaimPassword] = useState("")\n  const [eligibilityAccepted, setEligibilityAccepted] = useState(false)', 'eligibility state')
          s=rep(s,
          '  const used = Math.max(0, Number(participant?.attempts_used) || 0)\n  const freeRemaining = Math.max(0, Number(participant?.free_attempts_remaining ?? 1 - used) || 0)\n  const paidCredits = Math.max(0, Number(participant?.paid_credits) || 0)\n  const totalRemaining = Math.max(0, Number(participant?.attempts_remaining ?? freeRemaining + paidCredits) || 0)\n\n  const action = useMemo(() => {\n    if (participant?.active_attempt_id) return { href: "/battle-test", label: "Lanjutkan tes yang aktif" }\n    if (freeRemaining > 0) return { href: "/battle-test", label: `Mulai tes · sisa gratis ${freeRemaining}x` }\n    if (paidCredits > 0) return { href: "/battle-test", label: `Mulai Rematch · kredit ${paidCredits}x` }\n    return { href: "/payment?product=attempt_credit", label: "Buka Rematch · Rp5.000" }\n  }, [participant?.active_attempt_id, freeRemaining, paidCredits])',
          '  const used = Math.max(0, Number(participant?.attempts_used) || 0)\n  const freeRemaining = Math.max(0, Number(participant?.free_attempts_remaining ?? 3 - used) || 0)\n  const totalRemaining = Math.max(0, Number(participant?.attempts_remaining ?? freeRemaining) || 0)\n\n  const action = useMemo(() => {\n    if (participant?.active_attempt_id) return { href: "/battle-test", label: "Lanjutkan Ranked yang aktif" }\n    if (freeRemaining > 0) return { href: "/battle-test", label: `Mulai Ranked · sisa ${freeRemaining}x` }\n    return { href: "/battle#peringkat", label: "3 Ranked season ini sudah digunakan" }\n  }, [participant?.active_attempt_id, freeRemaining])', 'account ranked state')
          s=rep(s,
          '  const response = await fetch(ACCOUNT_API, { method: "POST", headers, body: JSON.stringify({ action, ...body }) })\n  const data = await response.json().catch(() => ({}))\n  if (!response.ok) throw new Error(data?.error || "Layanan akun belum dapat memproses permintaan.")',
          '  const endpoint = action === "regions" || action === "register" ? REGION_API : ACCOUNT_API\n  const response = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ action, ...body }) })\n  const data = await response.json().catch(() => ({}))\n  if (!response.ok) { const err = new Error(data?.error || "Layanan akun belum dapat memproses permintaan.") as Error & { status?: number }; err.status = response.status; throw err }', 'account api status')
          s=rep(s,
          '  async function loadMe(rawToken: string) {\n    try {\n      const data = await api("me", {}, rawToken)\n      setParticipant(data.participant || null)\n      setEditNickname(data.participant?.nickname || "")\n      setRecoveryEmail(data.participant?.email || "")\n    } catch {\n      localStorage.removeItem(PARTICIPANT_TOKEN_KEY)\n      setToken("")\n      setParticipant(null)\n    } finally {\n      setLoading(false)\n    }\n  }',
          '  async function loadMe(rawToken: string) {\n    try {\n      const [data, recovery] = await Promise.all([api("me", {}, rawToken), recoveryApi({ action: "state", kind: "participant" }, rawToken).catch(() => ({ state: {} }))])\n      const next = data.participant ? { ...data.participant, email_verified: Boolean(recovery?.state?.verified) } : null\n      setParticipant(next)\n      setEditNickname(next?.nickname || "")\n      setRecoveryEmail(next?.email || recovery?.state?.email || "")\n    } catch (e) {\n      const status = Number((e as Error & { status?: number })?.status || 0)\n      if (status === 401) { localStorage.removeItem(PARTICIPANT_TOKEN_KEY); setToken(""); setParticipant(null) }\n      else setError("Koneksi akun sedang terganggu. Sesi Anda tetap disimpan; coba muat ulang.")\n    } finally {\n      setLoading(false)\n    }\n  }', 'resilient loadMe')
          s=s.replace('setNotice("Pendaftaran berhasil. Wilayah akun sudah dikunci dari daftar resmi dan Anda mendapat 1 Ranked Attempt gratis.")','setNotice("Pendaftaran berhasil. Wilayah akun sudah dikunci dari daftar resmi dan Anda mendapat 3 Ranked Battle gratis pada season ini. Verifikasi email agar pemulihan password aktif.")')
          s=rep(s,
          '      setRecoveryEmail(savedEmail); setParticipant((prev) => prev ? { ...prev, email: savedEmail, email_configured: true } : prev)\n      setNotice("Email pemulihan berhasil disimpan.")',
          '      setRecoveryEmail(savedEmail); setParticipant((prev) => prev ? { ...prev, email: savedEmail, email_configured: true, email_verified: false } : prev)\n      setNotice("Email disimpan. Kirim link verifikasi agar dapat dipakai untuk pemulihan password.")', 'email save notice')
          insert='''\n  async function requestEmailVerification() {\n    clearMessages(); setBusy(true)\n    try { const data = await recoveryApi({ action: "request_verify" }, token); setNotice(data.message || "Link verifikasi sudah dikirim.") }\n    catch (e) { setError(messageText(e)) } finally { setBusy(false) }\n  }\n\n  async function deleteAccount() {\n    const password = window.prompt("Masukkan password akun untuk menghapus akun ALZAVA secara permanen dari akses publik.") || ""\n    if (!password) return\n    if (window.prompt("Ketik HAPUS untuk konfirmasi terakhir.") !== "HAPUS") return\n    setBusy(true); clearMessages()\n    try {\n      const response = await fetch(DELETE_API,{method:"POST",headers:{"Content-Type":"application/json","X-Battle-Token":token},body:JSON.stringify({action:"delete",password})})\n      const data = await response.json().catch(()=>({}))\n      if(!response.ok) throw new Error(data?.error || "Akun belum dapat dihapus.")\n      localStorage.removeItem(PARTICIPANT_TOKEN_KEY); window.location.replace("/battle")\n    } catch(e) { setError(messageText(e)); setBusy(false) }\n  }\n'''
          s=rep(s,'\n  async function updateNickname(event: FormEvent) {',insert+'\n  async function updateNickname(event: FormEvent) {','account actions insert')
          s=rep(s,
          '  function logout() {\n    localStorage.removeItem(PARTICIPANT_TOKEN_KEY); setToken(""); setParticipant(null); setNotice(""); setError(""); setTab("login")\n  }',
          '  async function logout() {\n    try { await fetch(SESSION_API,{method:"POST",headers:{"Content-Type":"application/json","X-Battle-Token":token},body:JSON.stringify({action:"logout"})}) } catch {}\n    localStorage.removeItem(PARTICIPANT_TOKEN_KEY); setToken(""); setParticipant(null); setNotice(""); setError(""); setTab("login")\n  }', 'remote logout')
          s=rep(s,
          '                {regionError ? <p className="text-sm font-semibold text-rose-300">{regionError}</p> : <p className="text-xs leading-5 text-slate-500">Kabupaten/kota dan kecamatan diambil dari referensi wilayah resmi sistem; peserta tidak lagi mengetik nama wilayah sendiri.</p>}\n                <button disabled={busy || regionsLoading || !regencyCode || !districtCode} className="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 font-black disabled:opacity-60">{busy ? "Mendaftarkan…" : "Daftar & Masuk"}</button>',
          '                {regionError ? <p className="text-sm font-semibold text-rose-300">{regionError}</p> : <p className="text-xs leading-5 text-slate-500">Referensi wilayah disimpan di cache ALZAVA agar pendaftaran tetap stabil saat layanan wilayah eksternal melambat.</p>}\n                <label className="flex items-start gap-3 rounded-xl border border-white/10 bg-white/[.035] p-3 text-xs leading-5 text-slate-400"><input type="checkbox" checked={eligibilityAccepted} onChange={e=>setEligibilityAccepted(e.target.checked)} className="mt-1"/><span>Saya berusia 18 tahun atau menggunakan ALZAVA dengan persetujuan orang tua/wali, serta menyetujui Syarat & Ketentuan.</span></label>\n                <button disabled={busy || regionsLoading || !regencyCode || !districtCode || !eligibilityAccepted} className="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 font-black disabled:opacity-60">{busy ? "Mendaftarkan…" : "Daftar & Masuk"}</button>', 'registration eligibility')
          s=rep(s,
          '                <div className="flex flex-wrap gap-2"><a href={action.href} className="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 text-sm font-black">{action.label}</a><button onClick={logout} className="rounded-xl border border-white/15 bg-white/5 px-5 py-3 text-sm font-bold text-slate-200 hover:bg-white/10">Keluar</button></div>',
          '                <div className="flex flex-wrap gap-2"><a href={action.href} className="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 text-sm font-black">{action.label}</a><button onClick={()=>void logout()} className="rounded-xl border border-white/15 bg-white/5 px-5 py-3 text-sm font-bold text-slate-200 hover:bg-white/10">Keluar perangkat ini</button></div>', 'account logout button')
          s=rep(s,
          '              <div className="mt-7 grid gap-3 sm:grid-cols-4">\n                <div className="rounded-2xl border border-cyan-300/25 bg-cyan-300/10 p-4"><span className="text-xs text-cyan-100">Kuota gratis / season</span><strong className="mt-1 block text-3xl font-black">1x</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Gratis digunakan</span><strong className="mt-1 block text-3xl font-black">{Math.min(1, used)}/1</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Sisa gratis</span><strong className="mt-1 block text-3xl font-black">{freeRemaining}x</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Kredit Rematch</span><strong className="mt-1 block text-3xl font-black">{paidCredits}x</strong></div>\n              </div>\n              <p className="mt-4 text-sm text-slate-400">Total percobaan yang masih dapat dipakai sekarang: <strong className="text-white">{totalRemaining}x</strong>.</p>',
          '              <div className="mt-7 grid gap-3 sm:grid-cols-4">\n                <div className="rounded-2xl border border-cyan-300/25 bg-cyan-300/10 p-4"><span className="text-xs text-cyan-100">Kuota Ranked / season</span><strong className="mt-1 block text-3xl font-black">3x</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Ranked digunakan</span><strong className="mt-1 block text-3xl font-black">{Math.min(3, used)}/3</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Sisa Ranked</span><strong className="mt-1 block text-3xl font-black">{freeRemaining}x</strong></div>\n                <div className="rounded-2xl border border-white/10 bg-white/5 p-4"><span className="text-xs text-slate-400">Format resmi</span><strong className="mt-1 block text-2xl font-black">20 soal</strong></div>\n              </div>\n              <p className="mt-4 text-sm text-slate-400">Sisa kesempatan season ini: <strong className="text-white">{totalRemaining}x</strong>. Skor terbaik dari maksimal 3 Ranked menentukan posisi leaderboard.</p>', 'account stats')
          old='<section className={`rounded-3xl border p-6 ${participant.email ? "border-emerald-300/20 bg-emerald-300/[.06]" : "border-amber-300/25 bg-amber-300/10"}`}><h3 className="text-xl font-black">Email Pemulihan</h3><p className="mt-1 text-sm text-slate-300">{participant.email ? "Email ini dipakai untuk mengirim tautan reset jika Anda lupa password." : "Tambahkan email agar password bisa dipulihkan tanpa kehilangan skor dan riwayat."}</p><form onSubmit={saveRecoveryEmail} className="mt-5 flex flex-col gap-3 sm:flex-row"><input type="email" value={recoveryEmail} onChange={(e) => setRecoveryEmail(e.target.value)} required autoComplete="email" placeholder="nama@email.com" className={`${fieldClass} min-w-0 flex-1`} /><button disabled={busy} className="rounded-xl bg-emerald-500 px-5 py-3 font-black text-slate-950 disabled:opacity-60">{participant.email ? "Perbarui Email" : "Simpan Email"}</button></form></section>'
          new='<section className={`rounded-3xl border p-6 ${participant.email_verified ? "border-emerald-300/20 bg-emerald-300/[.06]" : "border-amber-300/25 bg-amber-300/10"}`}><div className="flex flex-wrap items-center justify-between gap-2"><h3 className="text-xl font-black">Email Pemulihan</h3><span className={`rounded-full px-3 py-1 text-xs font-black ${participant.email_verified?"bg-emerald-300/10 text-emerald-200":"bg-amber-300/10 text-amber-200"}`}>{participant.email_verified?"Terverifikasi":"Belum terverifikasi"}</span></div><p className="mt-1 text-sm text-slate-300">Email baru dapat dipakai untuk reset password setelah Anda membuka link verifikasi yang dikirim ALZAVA.</p><form onSubmit={saveRecoveryEmail} className="mt-5 flex flex-col gap-3 sm:flex-row"><input type="email" value={recoveryEmail} onChange={(e) => setRecoveryEmail(e.target.value)} required autoComplete="email" placeholder="nama@email.com" className={`${fieldClass} min-w-0 flex-1`} /><button disabled={busy} className="rounded-xl bg-emerald-500 px-5 py-3 font-black text-slate-950 disabled:opacity-60">{participant.email ? "Perbarui Email" : "Simpan Email"}</button>{participant.email && !participant.email_verified && <button type="button" onClick={()=>void requestEmailVerification()} disabled={busy} className="rounded-xl border border-amber-300/25 bg-amber-300/10 px-5 py-3 font-black text-amber-100 disabled:opacity-60">Kirim Verifikasi</button>}</form></section>'
          s=rep(s,old,new,'email verification UI')
          s=rep(s,
          '{participant.account_ready !== false && <section className="rounded-3xl border border-white/15 bg-[#0a1a37]/90 p-6"><h3 className="text-xl font-black">Keamanan Akun</h3><p className="mt-1 text-sm text-slate-400">Ganti password tanpa mengubah skor, peringkat, atau kuota.</p><form onSubmit={changePassword} className="mt-5 grid gap-4"><input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} required placeholder="Password saat ini" className={fieldClass} /><input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} required minLength={8} placeholder="Password baru minimal 8 karakter" className={fieldClass} /><button disabled={busy} className="rounded-xl border border-white/15 bg-white/10 px-5 py-3 font-black hover:bg-white/15 disabled:opacity-60">Ganti Password</button></form></section>}',
          '{participant.account_ready !== false && <section className="rounded-3xl border border-white/15 bg-[#0a1a37]/90 p-6"><h3 className="text-xl font-black">Keamanan Akun</h3><p className="mt-1 text-sm text-slate-400">Akun sekarang mendukung beberapa perangkat. Ganti password tanpa mengubah skor; pemulihan password akan mencabut seluruh sesi lama.</p><form onSubmit={changePassword} className="mt-5 grid gap-4"><input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} required placeholder="Password saat ini" className={fieldClass} /><input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} required minLength={8} placeholder="Password baru minimal 8 karakter" className={fieldClass} /><button disabled={busy} className="rounded-xl border border-white/15 bg-white/10 px-5 py-3 font-black hover:bg-white/15 disabled:opacity-60">Ganti Password</button></form><div className="mt-6 border-t border-white/10 pt-5"><p className="text-sm font-black text-rose-200">Hapus Akun</p><p className="mt-1 text-xs leading-5 text-slate-500">Menghapus akses publik, sesi login, profil, pertemanan, dan posisi leaderboard. Riwayat teknis minimum dapat dipertahankan untuk keamanan/audit.</p><button type="button" onClick={()=>void deleteAccount()} disabled={busy} className="mt-3 rounded-xl border border-rose-300/25 bg-rose-500/10 px-4 py-2.5 text-sm font-black text-rose-200 disabled:opacity-50">Hapus Akun Saya</button></div></section>}', 'account security delete')
          write(p,s)

          # Results: every attempt 1-3 is official Ranked; no paid rematch during Open Beta.
          p='app/account/results/page.tsx'; s=read(p)
          s=s.replace('import { ArrowLeft, CheckCircle2, Crown, History, Play, Settings, Sparkles, Trophy, WalletCards } from "lucide-react"','import { ArrowLeft, CheckCircle2, Crown, History, Play, Settings, Trophy } from "lucide-react"')
          s=rep(s,
          '  const freeRemaining=Math.max(0,Number(participant?.free_attempts_remaining ?? 1-used)||0)\n  const paidCredits=Math.max(0,Number(participant?.paid_credits)||0)\n  const active=Boolean(participant?.active_attempt_id)\n  const testHref=active || freeRemaining>0 || paidCredits>0 ? "/battle-test" : "/payment?product=attempt_credit"\n  const testLabel=active ? "Lanjutkan tes" : freeRemaining>0 ? `Mulai tes · gratis ${freeRemaining}x` : paidCredits>0 ? `Mulai Rematch · kredit ${paidCredits}x` : "Buka Rematch · Rp5.000"',
          '  const freeRemaining=Math.max(0,Number(participant?.free_attempts_remaining ?? 3-used)||0)\n  const active=Boolean(participant?.active_attempt_id)\n  const testHref=active || freeRemaining>0 ? "/battle-test" : "/battle#peringkat"\n  const testLabel=active ? "Lanjutkan Ranked" : freeRemaining>0 ? `Mulai Ranked · sisa ${freeRemaining}x` : "3 Ranked season ini sudah digunakan"', 'results ranked state')
          s=s.replace('<div className="rounded-2xl border border-violet-300/15 bg-violet-300/[.06] p-4"><span className="text-xs text-violet-100/70">Kredit Rematch</span><strong className="mt-1 block text-3xl font-black">{paidCredits}x</strong></div>','<div className="rounded-2xl border border-violet-300/15 bg-violet-300/[.06] p-4"><span className="text-xs text-violet-100/70">Kuota Ranked</span><strong className="mt-1 block text-3xl font-black">3x</strong></div>')
          s=s.replace('                const paid=Number(item.attempt_number||0)>1\n','                const legacy=Number(item.attempt_number||0)>3\n')
          s=s.replace('{paid?"Rematch / Practice":"Ranked resmi"}','{legacy?"Arsip lama":"Ranked resmi"}')
          s=re.sub(r'\n\s*\{!item\.premium_unlocked && item\.attempt_id \? <a href=\{`/payment\?product=premium_report&attempt=\$\{encodeURIComponent\(item\.attempt_id\)\}`\}[\s\S]*?</a> : null\}', '', s, count=1)
          s=s.replace('<a href="/payment?product=attempt_credit" className="rounded-2xl border border-white/10 bg-white/[.035] p-5 hover:bg-white/[.06]"><WalletCards className="h-5 w-5 text-violet-300"/><p className="mt-3 font-black">Kredit Rematch</p><p className="mt-1 text-sm text-slate-500">Tambah Rematch / Practice untuk latihan dan analisis tanpa mengubah leaderboard resmi.</p></a>','<a href="/battle-test" className="rounded-2xl border border-white/10 bg-white/[.035] p-5 hover:bg-white/[.06]"><Play className="h-5 w-5 text-violet-300"/><p className="mt-3 font-black">Ranked Battle</p><p className="mt-1 text-sm text-slate-500">Gunakan maksimal 3 kesempatan resmi; skor terbaik menentukan leaderboard season.</p></a>')
          write(p,s)

          # Navbar: server-side logout current participant session and lower polling pressure.
          p='components/site-navbar.tsx'; s=read(p)
          s=rep(s,'const SOCIAL_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-social"','const SOCIAL_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-social"\nconst SESSION_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-participant-session"','navbar session endpoint')
          s=s.replace('}, 30000)', '}, 60000)',1)
          s=rep(s,'  function logout() {\n    removeParticipantToken()\n    window.location.href = "/battle"\n  }','  async function logout() {\n    const token=getParticipantToken()\n    try { if(token) await fetch(SESSION_API,{method:"POST",headers:{"Content-Type":"application/json","X-Battle-Token":token},body:JSON.stringify({action:"logout"})}) } catch {}\n    removeParticipantToken()\n    window.location.href = "/battle"\n  }','navbar logout')
          s=s.replace('onClick={logout}', 'onClick={()=>void logout()}')
          write(p,s)

          # Admin season UI rewritten around official vs test seasons + automatic deadline close.
          write('components/admin-season-controls.tsx', '''"use client"\n\nimport { useCallback, useEffect, useState } from "react"\nimport { Archive, CalendarPlus, Loader2, RefreshCw, RotateCcw, Trophy } from "lucide-react"\n\nconst API_URL = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-season-admin"\n\ntype LiveSeason = { id?:string; season_number?:number; label?:string; starts_at?:string; ends_at?:string; status?:string; leaderboard_count?:number; is_test?:boolean; archive_enabled?:boolean; expired?:boolean }\ntype SeasonState = { live_season?:LiveSeason|null; history_count?:number }\n\nasync function seasonApi(body:Record<string,unknown>){const response=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data?.error||"Kontrol season gagal diproses.");return data}\n\nexport function AdminSeasonControls({token}:{token:string}){\n  const [state,setState]=useState<SeasonState>({});const [busy,setBusy]=useState(false);const [message,setMessage]=useState("");const [error,setError]=useState("");const [label,setLabel]=useState("");const [durationHours,setDurationHours]=useState(168)\n  const load=useCallback(async()=>{if(!token)return;setError("");try{const data=await seasonApi({action:"state",admin_token:token});setState(data.state||{})}catch(e){setError(e instanceof Error?e.message:"Status season belum dapat dimuat.")}},[token])\n  useEffect(()=>{void load()},[load])\n  async function run(action:"close"|"open"|"open_test"|"cancel_test"|"reset"){if(!token||busy)return;const live=state.live_season;if(action==="close"&&!window.confirm("Tutup season RESMI sekarang? Top 3 final akan disimpan ke History Ranking."))return;if(action==="cancel_test"&&!window.confirm("Tutup season TESTING tanpa menyimpan Top 3 ke History Ranking?"))return;if(action==="reset"&&window.prompt("Kosongkan leaderboard saja? Ketik RESET.")!=="RESET")return;if((action==="open"||action==="open_test")&&live)return;setBusy(true);setError("");setMessage("");try{const payload:Record<string,unknown>={action,admin_token:token};if(action==="open"||action==="open_test"){payload.label=label.trim();payload.duration_hours=action==="open_test"?Math.min(168,durationHours):durationHours}const data=await seasonApi(payload);if(action==="close")setMessage(`Season resmi ditutup. ${Number(data?.result?.winner_count||0)} juara disimpan.`);if(action==="cancel_test")setMessage("Season testing ditutup tanpa masuk History Ranking.");if(action==="reset")setMessage(`Ranking dibersihkan: ${Number(data?.result?.deleted_count||0)} entri.`);if(action==="open"||action==="open_test"){setMessage(action==="open"?"Season resmi baru dibuka.":"Season testing dibuka dan tidak akan masuk History Ranking.");setLabel("")}await load()}catch(e){setError(e instanceof Error?e.message:"Kontrol season gagal diproses.")}finally{setBusy(false)}}\n  const live=state.live_season\n  return <section className="mb-6 overflow-hidden rounded-3xl border border-cyan-300/15 bg-gradient-to-br from-cyan-400/[.08] via-indigo-500/[.06] to-slate-950/40 p-5 shadow-2xl sm:p-6">\n    <div className="flex flex-wrap items-start justify-between gap-4"><div><div className="flex items-center gap-2 text-cyan-300"><Trophy className="h-5 w-5"/><p className="text-xs font-black uppercase tracking-[.18em]">Kontrol Season</p></div><h2 className="mt-2 text-2xl font-black">Season resmi terpisah dari testing</h2><p className="mt-2 max-w-3xl text-sm leading-6 text-slate-400">Season ditutup otomatis ketika deadline server tercapai. Season resmi mengarsipkan Top 3; season testing tidak pernah masuk History Ranking.</p></div><button onClick={()=>load()} disabled={busy} className="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm font-bold"><RefreshCw className={`h-4 w-4 ${busy?"animate-spin":""}`}/>Refresh</button></div>\n    <div className="mt-5 grid gap-4 lg:grid-cols-[1.15fr_.85fr]">\n      <div className="rounded-2xl border border-white/10 bg-slate-950/45 p-5"><p className="text-xs font-bold uppercase tracking-wider text-slate-500">Season Aktif</p>{live?<><div className="mt-2 flex flex-wrap items-end justify-between gap-3"><div><p className="text-2xl font-black">{live.label||`Season ${live.season_number}`}</p><p className="mt-1 text-sm text-slate-400">{Number(live.leaderboard_count||0)} peserta · deadline {live.ends_at?new Date(live.ends_at).toLocaleString("id-ID"):"—"}</p></div><span className={`rounded-full border px-3 py-1.5 text-xs font-black uppercase ${live.is_test?"border-amber-300/20 bg-amber-300/10 text-amber-200":"border-emerald-300/20 bg-emerald-300/10 text-emerald-200"}`}>{live.is_test?"TESTING":"RESMI"}</span></div><div className="mt-5 flex flex-wrap gap-2">{live.is_test?<button onClick={()=>run("cancel_test")} disabled={busy} className="inline-flex items-center gap-2 rounded-xl bg-amber-500 px-4 py-3 text-sm font-black text-slate-950"><Archive className="h-4 w-4"/>Tutup Testing Tanpa Arsip</button>:<button onClick={()=>run("close")} disabled={busy} className="inline-flex items-center gap-2 rounded-xl bg-amber-500 px-4 py-3 text-sm font-black text-slate-950"><Archive className="h-4 w-4"/>Tutup Resmi + Arsip Top 3</button>}<button onClick={()=>run("reset")} disabled={busy} className="inline-flex items-center gap-2 rounded-xl border border-rose-300/25 bg-rose-500/10 px-4 py-3 text-sm font-black text-rose-200"><RotateCcw className="h-4 w-4"/>Kosongkan Leaderboard</button></div></>:<div className="mt-3 rounded-xl border border-dashed border-white/15 bg-white/[.03] p-5 text-sm text-slate-400">Tidak ada season aktif.</div>}</div>\n      <div className="rounded-2xl border border-white/10 bg-slate-950/45 p-5"><div className="flex items-center justify-between gap-3"><p className="text-xs font-bold uppercase tracking-wider text-slate-500">Buka Season</p><span className="text-xs font-bold text-violet-300">{Number(state.history_count||0)} di history</span></div><label className="mt-4 grid gap-2 text-xs font-bold text-slate-400">Nama season (opsional)<input value={label} onChange={e=>setLabel(e.target.value)} disabled={Boolean(live)||busy} className="rounded-xl border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-white"/></label><label className="mt-3 grid gap-2 text-xs font-bold text-slate-400">Durasi (jam)<input type="number" min={1} max={720} value={durationHours} onChange={e=>setDurationHours(Math.max(1,Math.min(720,Number(e.target.value)||168)))} disabled={Boolean(live)||busy} className="rounded-xl border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-white"/></label><div className="mt-4 grid gap-2"><button onClick={()=>run("open")} disabled={Boolean(live)||busy} className="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 text-sm font-black disabled:opacity-40">{busy?<Loader2 className="h-4 w-4 animate-spin"/>:<CalendarPlus className="h-4 w-4"/>}Buka Season Resmi</button><button onClick={()=>run("open_test")} disabled={Boolean(live)||busy} className="rounded-xl border border-amber-300/25 bg-amber-300/10 px-4 py-3 text-sm font-black text-amber-100 disabled:opacity-40">Buka Season Testing · Tanpa History</button></div></div>\n    </div>{message&&<div className="mt-4 rounded-xl border border-emerald-300/20 bg-emerald-300/10 px-4 py-3 text-sm text-emerald-100">{message}</div>}{error&&<div className="mt-4 rounded-xl border border-rose-300/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-100">{error}</div>}\n  </section>\n}\n''')

          # Positioning + asset performance.
          p='components/hero.tsx'; s=read(p).replace('/images/hero-bg.png?v=cf5','/images/hero-bg-opt.webp?v=stabilized').replace('Leaderboard diperbarui live','Leaderboard diperbarui otomatis'); write(p,s)
          p='components/podium.tsx'; s=read(p)
          for a,b in [('crown-gold.webp?v=growth-p0','crown-gold-opt.webp?v=stabilized'),('crown-silver.webp?v=growth-p0','crown-silver-opt.webp?v=stabilized'),('crown-bronze.webp?v=growth-p0','crown-bronze-opt.webp?v=stabilized'),('laurel-gold.png?v=cf5','laurel-gold-opt.webp?v=stabilized'),('laurel-silver.png?v=cf5','laurel-silver-opt.webp?v=stabilized'),('laurel-bronze.png?v=cf5','laurel-bronze-opt.webp?v=stabilized')]: s=s.replace(a,b)
          write(p,s)
          p='package.json'; s=read(p); s=s.replace('"build": "node scripts/merge-legacy.mjs && next build"','"build": "node scripts/optimize-assets.mjs && node scripts/merge-legacy.mjs && next build"'); write(p,s)
          p='scripts/merge-legacy.mjs'; s=read(p).replace('Prepared native Battle IQ production assets.','Prepared ALZAVA Battle Point production assets.'); write(p,s)

          # Metadata: brand first, TIU as secondary acquisition surface.
          p='app/layout.tsx'; s=read(p)
          s=re.sub(r'default: "ALZAVA Battle Point — Ranked Battle & Latihan TIU Indonesia"', 'default: "ALZAVA Battle Point — Competitive Brain Game Indonesia"', s)
          s=re.sub(r'description:\n\s*"Latihan TIU gratis sebagai bagian dari persiapan SKD, Simulasi TIU 35 soal, Ranked Battle 3x per minggu, Battle PVP 1v1, Battle Point, dan ranking kecamatan hingga nasional\."', 'description:\n    "Competitive brain game Indonesia: 3 Ranked Battle per season, Battle Point, ranking kecamatan hingga nasional, PVP 1v1, Quick Battle, serta latihan TIU sebagai arena latihan non-ranked."', s)
          s=s.replace('    "latihan TIU CPNS gratis",','    "battle point Indonesia",\n    "competitive brain game Indonesia",\n    "game logika Indonesia",\n    "ranked battle Indonesia",\n    "peringkat kecamatan",\n    "kompetisi nalar Indonesia",\n    "latihan TIU CPNS gratis",')
          s=s.replace('    "battle point",\n    "ranked battle Indonesia",\n    "battle pvp",\n    "game logika Indonesia",\n    "peringkat kecamatan",\n    "kompetisi nalar Indonesia",','    "battle pvp",')
          s=s.replace('title: "ALZAVA Battle Point — Latihan TIU, Ranked Battle & PVP"','title: "ALZAVA Battle Point — Competitive Brain Game Indonesia"')
          s=s.replace('"Latihan TIU gratis, uji kemampuan di Ranked Battle, duel PVP 1v1, raih Battle Point, dan kejar ranking dari kecamatan hingga nasional."','"Adu nalar di Ranked Battle dan PVP 1v1, raih Battle Point, dan kejar ranking dari kecamatan hingga nasional. Latihan TIU tersedia sebagai mode non-ranked."')
          s=s.replace('description: "Latihan TIU. Raih Poin. Naik Peringkat. Battle PVP."','description: "Adu Nalar. Raih Poin. Naik Peringkat. Ranked Battle, PVP, dan Quick Battle."')
          write(p,s)

          p='public/sitemap.xml'; s=read(p); s=s.replace('  <url><loc>https://alzava-battle-iq.pages.dev/battle</loc><changefreq>daily</changefreq><priority>1.0</priority></url>','  <url><loc>https://alzava-battle-iq.pages.dev/battle</loc><changefreq>daily</changefreq><priority>1.0</priority></url>\n  <url><loc>https://alzava-battle-iq.pages.dev/quick-battle</loc><changefreq>weekly</changefreq><priority>0.99</priority></url>'); write(p,s)

          # Polling mitigation for Open Beta scale. Active PVP remains 2s because it is gameplay state.
          for p,old,new in [('components/global-chat.tsx','}, 3000)','}, 8000)'),('components/private-messages.tsx','}, 20000)','}, 30000)'),('components/private-messages.tsx','}, 5000)','}, 8000)'),('components/pvp-arena.tsx','},3000)','},5000)')]:
              s=read(p)
              if old not in s: raise SystemExit(f'missing polling pattern {p} {old}')
              write(p,s.replace(old,new,1))

          # Result: remove stale private pseudo-IQ scaffolding and old High Range claims for native 20 format.
          p='app/result/page.tsx'; s=read(p)
          s=re.sub(r'\nconst iqReferenceBands = \[[\s\S]*?\] as const\n', '\n', s, count=1)
          s=re.sub(r'\nfunction iqTier\(iq:number\) \{[\s\S]*?\n\}\n', '\n', s, count=1)
          s=s.replace('  const iq=Number(result.iq_estimate||0)\n','')
          s=s.replace('    result?.high_range_attempted ? "Anda telah melewati High Range, sehingga estimasi rentang atas mendapat verifikasi tambahan." : "Hasil inti memberi baseline yang jelas untuk membandingkan perkembangan pada season berikutnya.",','    "Hasil Ranked 20 soal memberi baseline yang konsisten untuk dibandingkan dengan kesempatan berikutnya pada season yang sama.",')
          s=s.replace('{result.high_range_attempted ? "High Range selesai. Skor rentang atas diuji dengan soal tambahan yang lebih sulit, sehingga estimasi tinggi memiliki bukti tambahan." : "High Range tidak dikerjakan pada hasil ini. Untuk skor inti yang sangat tinggi pada format baru, sistem akan membuka tahap verifikasi tambahan."}','Format Ranked resmi sekarang selalu 20 soal. Interpretasi difokuskan pada Battle Point, akurasi, tempo, dan profil domain—bukan estimasi IQ.')
          write(p,s)

          # Verify-email callback page.
          write('app/verify-email/page.tsx','''"use client"\n\nimport { useEffect, useState } from "react"\nimport { PARTICIPANT_TOKEN_KEY } from "@/lib/battle"\nconst API="https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-recovery"\nexport default function VerifyEmailPage(){const [status,setStatus]=useState("Memverifikasi email…");const [ok,setOk]=useState(false);useEffect(()=>{const hash=new URLSearchParams(window.location.hash.replace(/^#/,""));const access=hash.get("access_token")||"";const token=localStorage.getItem(PARTICIPANT_TOKEN_KEY)||"";if(!access||!token){setStatus("Link harus dibuka pada perangkat/browser yang masih login ke akun ALZAVA.");return}fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-Battle-Token":token},body:JSON.stringify({action:"verify",access_token:access})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error||"Email belum dapat diverifikasi.");setOk(true);setStatus(d?.message||"Email berhasil diverifikasi.");window.history.replaceState({},"",window.location.pathname)}).catch(e=>setStatus(e instanceof Error?e.message:"Email belum dapat diverifikasi."))},[]);return <main className="grid min-h-screen place-items-center bg-[#020817] px-5 text-white"><section className="w-full max-w-lg rounded-3xl border border-white/10 bg-white/[.055] p-8 text-center shadow-2xl"><img src="/alzava-emblem-v3.svg" alt="" className="mx-auto h-16 w-16"/><h1 className="mt-5 text-3xl font-black">Verifikasi Email ALZAVA</h1><div className={`mt-5 rounded-2xl border p-4 text-sm ${ok?"border-emerald-300/20 bg-emerald-300/10 text-emerald-100":"border-cyan-300/20 bg-cyan-300/10 text-cyan-100"}`}>{status}</div><a href="/account" className="mt-6 inline-flex rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-3 font-black">Kembali ke Akun</a></section></main>}\n''')

          # Legal copy follows actual product controls.
          p='app/privacy/page.tsx'; s=read(p)
          s=s.replace('Mekanisme penghapusan akun mandiri akan disediakan pada pengembangan berikutnya; sementara itu pertanyaan mengenai data pribadi dapat disampaikan melalui halaman Bantuan.','Penghapusan akun mandiri tersedia pada halaman Akun. Saat digunakan, akses publik, sesi login, profil, pertemanan, dan posisi leaderboard dinonaktifkan/dihapus; catatan teknis minimum dapat dipertahankan bila diperlukan untuk keamanan, pencegahan penyalahgunaan, atau audit.')
          s=s.replace('Anda dapat memperbarui Nama Panggilan dan foto profil, menghapus foto profil, mengganti password, serta meminta koreksi informasi akun yang keliru.','Anda dapat memperbarui Nama Panggilan dan foto profil, menghapus foto profil, mengganti password, memverifikasi email pemulihan, serta meminta koreksi informasi akun yang keliru.')
          write(p,s)
          p='app/terms/page.tsx'; s=read(p)
          marker='<section><h2 className="text-xl font-black text-white">Ranked Battle season</h2>'
          s=s.replace(marker,'<section><h2 className="text-xl font-black text-white">Usia & persetujuan</h2><p className="mt-2">Pengguna berusia 18 tahun ke atas dapat membuat akun sendiri. Pengguna di bawah 18 tahun hanya boleh menggunakan layanan dengan persetujuan orang tua atau wali, terutama untuk fitur sosial seperti Chat Global, pertemanan, dan pesan pribadi.</p></section>\n    '+marker)
          write(p,s)

          # Policy tests catch future regressions in legacy paid/rematch copy.
          p='tests/open-beta-policy.test.mjs'; s=read(p)
          s += '''\n\ntest("Account and result history follow 3 official Ranked Open Beta policy",()=>{\n  for(const p of ["app/account/page.tsx","app/account/results/page.tsx"]){\n    const s=read(p)\n    assert.doesNotMatch(s,/Buka Rematch|Kredit Rematch|Rematch \/ Practice|Rp5\\.000/)\n    assert.match(s,/3 Ranked|3x|3 kesempatan/)\n  }\n})\n\ntest("Participant logout reaches server session endpoint",()=>{\n  const s=read("components/site-navbar.tsx")\n  assert.match(s,/battle-participant-session/)\n  assert.match(s,/action:\"logout\"|action: \"logout\"/)\n})\n\ntest("Quick Battle is indexed and homepage branding leads with Battle Point",()=>{\n  assert.match(read("public/sitemap.xml"),/quick-battle/)\n  assert.match(read("app/layout.tsx"),/Competitive Brain Game Indonesia/)\n})\n'''
          write(p,s)

          # Browser smoke test + workflow (no app secrets required).
          write('tests/browser-smoke.mjs','''import { chromium } from "playwright"\nconst base="http://127.0.0.1:4173"\nconst routes=["/battle/","/quick-battle/","/account/","/battle-test/","/pvp/","/help/"]\nconst browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const pageErrors=[];page.on("pageerror",e=>pageErrors.push(String(e)));for(const route of routes){const r=await page.goto(base+route,{waitUntil:"domcontentloaded",timeout:20000});if(!r||r.status()>=400)throw new Error(`${route} HTTP ${r?.status()}`);const text=(await page.locator("body").innerText()).trim();if(text.length<20)throw new Error(`${route} rendered empty`)}await browser.close();if(pageErrors.length)throw new Error(`browser page errors: ${pageErrors.join(" | ")}`);console.log(`smoke ok: ${routes.length} routes`)\n''')
          write('.github/workflows/web-smoke.yml','''name: Browser Smoke\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\njobs:\n  smoke:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci --no-audit --no-fund\n      - run: npm install --no-save playwright@1.55.0\n      - run: npx playwright install --with-deps chromium\n      - run: npm run build\n      - name: Serve static export and smoke routes\n        run: |\n          python3 -m http.server 4173 -d out >/tmp/alzava-http.log 2>&1 &\n          sleep 2\n          node tests/browser-smoke.mjs\n''')

          # Remove this one-off mutating workflow in the resulting source commit.
          Path('.github/workflows/stabilization-v1.yml').unlink()
          PY
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit stabilization
        run: |
          git config user.name "alzava-stabilizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize ALZAVA Open Beta core"
          git push origin HEAD:main
