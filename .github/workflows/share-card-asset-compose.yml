name: Asset-based share card visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/share-card-asset-compose.yml"
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Polish dynamic layers on repository artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/result-share-card.tsx')
          s=p.read_text(encoding='utf-8')

          old='''  const province=profile.province_code||""\n  const regency=normalizeRegency(profile.regency_name||props.regencyName)\n  const district=normalizeDistrict(profile.district_name||props.districtName)'''
          new='''  const province=profile.province_code||""\n  // Scope queries must use the exact region strings stored on the participant, just like buildScopeQuery().\n  const regency=profile.regency_name||props.regencyName||""\n  const district=profile.district_name||props.districtName||""'''
          if old not in s: raise SystemExit('rank query block missing')
          s=s.replace(old,new)

          old='''  // Headline.\n  ctx.save();ctx.shadowColor=official?"rgba(245,158,11,.38)":"rgba(124,58,237,.35)";ctx.shadowBlur=24\n  ctx.fillStyle="#f8fafc";ctx.font="italic 900 66px Arial,sans-serif";ctx.fillText(official?"SKOR INI":"REMATCH",540,334)\n  const accent=ctx.createLinearGradient(220,0,860,0)\n  accent.addColorStop(0,official?"#f59e0b":"#22d3ee");accent.addColorStop(.5,"#fff4b8");accent.addColorStop(1,official?"#f59e0b":"#a855f7")\n  ctx.fillStyle=accent;ctx.font="italic 900 86px Arial,sans-serif";ctx.fillText(official?"SULIT DIKEJAR!":"HIGH SCORE!",540,415)\n  ctx.restore()'''
          new='''  // Headline: dynamic text only, styled to sit on top of the approved arena art.\n  const line1=official?"SKOR INI":"REMATCH"\n  const line2=official?"SULIT DIKEJAR!":"HIGH SCORE!"\n  ctx.save()\n  ctx.font="italic 900 72px Arial,sans-serif"\n  ctx.lineJoin="round"\n  ctx.strokeStyle="rgba(0,0,0,.75)";ctx.lineWidth=18;ctx.strokeText(line1,540,326)\n  ctx.strokeStyle=official?"rgba(180,83,9,.95)":"rgba(30,64,175,.95)";ctx.lineWidth=7;ctx.strokeText(line1,540,326)\n  ctx.fillStyle="#f8fafc";ctx.shadowColor="rgba(255,255,255,.35)";ctx.shadowBlur=14;ctx.fillText(line1,540,326)\n  ctx.shadowBlur=0\n  ctx.font="italic 900 104px Arial,sans-serif"\n  for(let off=12;off>=3;off-=3){ctx.fillStyle=official?`rgba(120,53,15,${.18+off/70})`:`rgba(49,46,129,${.18+off/70})`;ctx.fillText(line2,540+off*.28,416+off)}\n  const accent=ctx.createLinearGradient(190,0,890,0)\n  accent.addColorStop(0,official?"#f59e0b":"#22d3ee");accent.addColorStop(.48,"#fff7bf");accent.addColorStop(1,official?"#f59e0b":"#a855f7")\n  ctx.strokeStyle="rgba(0,0,0,.8)";ctx.lineWidth=20;ctx.strokeText(line2,540,416)\n  ctx.strokeStyle=official?"#fbbf24":"#67e8f9";ctx.lineWidth=6;ctx.strokeText(line2,540,416)\n  ctx.fillStyle=accent;ctx.shadowColor=official?"#f59e0b":"#22d3ee";ctx.shadowBlur=26;ctx.fillText(line2,540,416)\n  ctx.restore()'''
          if old not in s: raise SystemExit('headline block missing')
          s=s.replace(old,new)

          s=s.replace('ctx.globalAlpha=official?.78:.60;cover(ctx,trophy,70,455,940,760)','ctx.globalAlpha=official?1:.72;cover(ctx,trophy,35,445,1010,790)')

          old='''  if(crownAsset){ctx.save();ctx.shadowColor=official?"#f59e0b":"#cbd5e1";ctx.shadowBlur=22;ctx.drawImage(crownAsset,470,455,140,140);ctx.restore()}\n\n  const nameSize=fit(ctx,props.nickname,650,50,30)'''
          new='''  if(crownAsset){ctx.save();ctx.shadowColor=official?"#f59e0b":"#cbd5e1";ctx.shadowBlur=22;ctx.drawImage(crownAsset,470,455,140,140);ctx.restore()}\n  if(official&&props.nationalRank){\n    const badgeY=790\n    const med=ctx.createLinearGradient(500,badgeY-36,580,badgeY+36);med.addColorStop(0,"#fff7bf");med.addColorStop(.45,"#fbbf24");med.addColorStop(1,"#b45309")\n    ctx.save();ctx.shadowColor="#f59e0b";ctx.shadowBlur=18;ctx.fillStyle=med;ctx.beginPath();ctx.arc(540,badgeY,38,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff1a8";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#7c2d12";ctx.font="900 31px Arial,sans-serif";ctx.fillText(String(props.nationalRank),540,badgeY+11);ctx.restore()\n  }\n\n  const nameSize=fit(ctx,props.nickname,650,50,30)'''
          if old not in s: raise SystemExit('crown insertion point missing')
          s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Create ephemeral QA page
        shell: bash
        run: |
          mkdir -p app/share-card-lab
          cat > app/share-card-lab/page.tsx <<'EOF'
          "use client"
          import ResultShareCard from "@/components/result-share-card"
          const avatar="https://efndozplpwyemzgqfnep.supabase.co/storage/v1/object/public/battle-avatars/3cd238c2-234d-4a3c-a1b0-747ebddb839b/profile.png?v=1790252164030"
          export default function Page(){return <main className="min-h-screen bg-slate-950 p-4"><ResultShareCard nickname="Aditakaa" participantPublicId="3cd238c2-234d-4a3c-a1b0-747ebddb839b" battlePoint={825} correctCount={33} questionCount={40} durationMs={937691} nationalRank={1} leaderboardTotal={7} provinceName="Jawa Timur" regencyName="Kab. Sumenep" districtName="Kota Sumenep" submittedAt="2026-09-21T05:09:00+07:00" rankedAttempt autoOpen debugQa demoProfile={{avatar_url:avatar,province_code:"35",province_name:"Jawa Timur",regency_name:"Kab. Sumenep",district_name:"Kota Sumenep"}} /></main>}
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Start app and capture preview
        shell: bash
        run: |
          (npx next dev -H 127.0.0.1 -p 3000 >/tmp/alzava.log 2>&1 &)
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/share-card-lab/ >/dev/null && break; sleep 1; done
          mkdir -p qa-out
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=500,1450 --virtual-time-budget=10000 --screenshot=qa-out/share-card-asset-ranked-v2.png http://127.0.0.1:3000/share-card-lab/
      - uses: actions/upload-artifact@v4
        with:
          name: share-card-asset-ranked-v2
          path: qa-out/share-card-asset-ranked-v2.png
          retention-days: 1
      - name: Commit component only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/result-share-card.tsx
          git commit -m "Polish dynamic layers on approved share card artwork"
          git pull --rebase origin main
          git push origin HEAD:main
