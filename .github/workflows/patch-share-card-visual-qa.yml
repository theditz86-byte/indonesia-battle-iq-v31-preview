name: Patch share card visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-share-card-visual-qa.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove overlapping rematch badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/result-share-card.tsx')
          s=p.read_text(encoding='utf-8')
          block='''function pill(ctx:CanvasRenderingContext2D,x:number,y:number,w:number,text:string,accent="#a78bfa"){
  fillRound(ctx,x,y,w,54,27,"rgba(2,8,23,.78)")
  strokeRound(ctx,x,y,w,54,27,accent+"aa",2)
  ctx.fillStyle=accent;ctx.textAlign="center";ctx.font="900 20px Arial,sans-serif";ctx.fillText(text,x+w/2,y+34)
}
'''
          if block not in s: raise SystemExit('pill helper missing')
          s=s.replace(block,'')
          call='''  if(!official){pill(ctx,385,916,310,"REMATCH · PRACTICE","#a78bfa")}

'''
          if call not in s: raise SystemExit('pill call missing')
          s=s.replace(call,'')
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/result-share-card.tsx
          git commit -m "Remove overlapping rematch badge"
          git pull --rebase origin main
          git push origin HEAD:main
