name: ALZAVA Hardening V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hardening-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening patches
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f"anchor missing in {path}: expected >= {count}, got {actual}: {old[:90]!r}")
              p.write_text(s.replace(old,new,count))

          # Ranked: native 20 only, no browser fallback to legacy submission.
          rep("app/battle-test/page.tsx",
              '  if (answers.length !== 20) return callBattle(body, token)\n',
              '  if (answers.length !== 20) throw new Error("Format Ranked tidak valid. Muat ulang arena sebelum melanjutkan.")\n')
          rep("app/battle-test/page.tsx",
              '      if (!Array.isArray(started.questions) || !started.questions.length) throw new Error("Paket soal belum tersedia.")\n',
              '      if (!Array.isArray(started.questions) || started.questions.length !== 20) throw new Error("Paket Ranked tidak valid. Arena resmi saat ini wajib 20 soal.")\n')
          rep("app/battle-test/page.tsx",
              '      let restored = Array.isArray(started.core_answers) && started.high_range_unlocked\n        ? [...started.core_answers, ...Array(Math.max(0, started.questions.length - started.core_answers.length)).fill(null)]\n        : Array(started.questions.length).fill(null)\n      let restoredIndex = started.high_range_unlocked && started.questions.length > 30 ? 30 : 0\n',
              '      let restored: Array<number | null> = Array(20).fill(null)\n      let restoredIndex = 0\n')

          # TIU: server-side progress/resume + focus mode.
          rep("components/tiu-practice.tsx",
              'const TIU_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-tiu"\n',
              'const TIU_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-tiu"\nconst TIU_SESSION_API = "https://efndozplpwyemzgqfnep.supabase.co/functions/v1/battle-tiu-session"\n')
          rep("components/tiu-practice.tsx",
              'function timeText(ms:number) {\n',
              '''async function callTiuSession(body: Record<string,unknown>, keepalive=false) {\n  const token = getParticipantToken()\n  if (!token) throw new Error("participant_required")\n  const response = await fetch(TIU_SESSION_API, {\n    method: "POST",\n    headers: { "Content-Type":"application/json", "X-Battle-Token":token },\n    body: JSON.stringify(body),\n    cache: "no-store",\n    keepalive,\n  })\n  const data = await response.json().catch(() => ({}))\n  if (!response.ok) throw new Error(data?.error || "Sesi TIU belum dapat diproses.")\n  return data\n}\n\nfunction timeText(ms:number) {\n''')
          rep("components/tiu-practice.tsx",
              '  const autoSubmitRef = useRef(false)\n',
              '  const autoSubmitRef = useRef(false)\n  const progressTimerRef = useRef<number | null>(null)\n  const answersRef = useRef<Array<number|null>>([])\n  const indexRef = useRef(0)\n')
          rep("components/tiu-practice.tsx",
              '  const remainingMs = session ? Math.max(0,new Date(session.deadline_at).getTime()-now) : 0\n',
              '''  useEffect(()=>{ answersRef.current=answers },[answers])\n  useEffect(()=>{ indexRef.current=index },[index])\n\n  const remainingMs = session ? Math.max(0,new Date(session.deadline_at).getTime()-now) : 0\n''')
          rep("components/tiu-practice.tsx",
              '      const restored = s.resumed ? restoreLocalProgress(s.id,s.question_count) : null\n      setAnswers(restored?.answers || Array(s.question_count).fill(null))\n      setIndex(restored?.index || 0)\n',
              '''      let restored = s.resumed ? restoreLocalProgress(s.id,s.question_count) : null\n      if (s.resumed) {\n        try {\n          const saved = await callTiuSession({action:"progress_get",session_id:s.id})\n          if (Array.isArray(saved?.progress?.answers) && saved.progress.answers.length===s.question_count) {\n            restored = {\n              answers: saved.progress.answers.map((v:unknown)=>Number.isInteger(v)&&Number(v)>=0&&Number(v)<=4?Number(v):null),\n              index: Number.isInteger(saved?.progress?.current_index) && saved.progress.current_index>=0 && saved.progress.current_index<s.question_count ? saved.progress.current_index : 0,\n            }\n          }\n        } catch {}\n      }\n      setAnswers(restored?.answers || Array(s.question_count).fill(null))\n      setIndex(restored?.index || 0)\n''')
          rep("components/tiu-practice.tsx",
              '''  useEffect(()=>{\n    if(!session || !answers.length) return\n    try { window.localStorage.setItem(progressKey(session.id),JSON.stringify({answers,index,saved_at:Date.now()})) } catch {}\n  },[session?.id,answers,index])\n''',
              '''  useEffect(()=>{\n    if(!session || !answers.length) return\n    try { window.localStorage.setItem(progressKey(session.id),JSON.stringify({answers,index,saved_at:Date.now()})) } catch {}\n    if(progressTimerRef.current) window.clearTimeout(progressTimerRef.current)\n    progressTimerRef.current=window.setTimeout(()=>{\n      void callTiuSession({action:"progress_save",session_id:session.id,answers,current_index:index}).catch(()=>{})\n    },450)\n    return()=>{ if(progressTimerRef.current) window.clearTimeout(progressTimerRef.current) }\n  },[session?.id,answers,index])\n\n  useEffect(()=>{\n    if(!session) return\n    const heartbeat=window.setInterval(()=>{\n      void callTiuSession({action:"progress_save",session_id:session.id,answers:answersRef.current,current_index:indexRef.current}).catch(()=>{})\n    },15000)\n    const onHide=()=>{ void callTiuSession({action:"progress_save",session_id:session.id,answers:answersRef.current,current_index:indexRef.current},true).catch(()=>{}) }\n    window.addEventListener("pagehide",onHide)\n    return()=>{ window.clearInterval(heartbeat); window.removeEventListener("pagehide",onHide) }\n  },[session?.id])\n''')
          rep("components/tiu-practice.tsx",
              '      const data = await callTiu({action:"submit",session_id:session.id,answers})\n',
              '      const data = await callTiuSession({action:"submit",session_id:session.id,answers})\n')
          rep("components/tiu-practice.tsx",
              '    <SiteNavbar participant={participant}/>\n',
              '    {!session && <SiteNavbar participant={participant}/>}\n')
          rep("components/tiu-practice.tsx",
              '    <SiteFooter/>\n',
              '    {!session && <SiteFooter/>}\n')

          # PVP: focus mode while ready/live; lighter lobby polling.
          rep("components/pvp-arena.tsx",
              '    const t=window.setInterval(()=>{if(document.visibilityState==="visible")void loadLobby(true)},5000);return()=>window.clearInterval(t)\n',
              '    const t=window.setInterval(()=>{if(document.visibilityState==="visible")void loadLobby(true)},8000);return()=>window.clearInterval(t)\n')
          rep("components/pvp-arena.tsx",
              '  const region=(p?:Player)=>[p?.regency_name,p?.province_name].filter(Boolean).join(" · ")||"Indonesia"\n\n  return <div',
              '  const region=(p?:Player)=>[p?.regency_name,p?.province_name].filter(Boolean).join(" · ")||"Indonesia"\n  const focusMode=Boolean(matchId&&state&&(state.status==="ready"||state.status==="live"))\n\n  return <div')
          rep("components/pvp-arena.tsx",
              '    <SiteNavbar participant={participant}/>\n',
              '    {!focusMode && <SiteNavbar participant={participant}/>}\n')
          rep("components/pvp-arena.tsx",
              '    <SiteFooter/>\n',
              '    {!focusMode && <SiteFooter/>}\n')
          rep("components/pvp-arena.tsx","Update tiap 3 detik","Update otomatis")

          # Chat: reduce idle polling pressure.
          rep("components/global-chat.tsx",
              '    }, 8000)\n',
              '    }, 12000)\n')

          # Result: show Fair Play state and preserve previous verified score.
          rep("app/result/page.tsx",
              '    premium_unlocked?: boolean\n  }>\n',
              '    premium_unlocked?: boolean\n    integrity_status?: string\n    ranking_eligible?: boolean\n  }>\n')
          rep("app/result/page.tsx",
              '    national_rank?: number\n  } | null\n',
              '    national_rank?: number\n    integrity_status?: string\n    ranking_eligible?: boolean\n  } | null\n')
          rep("app/result/page.tsx",
              '''        </div>\n\n        {Array.isArray(data.attempts) && data.attempts.length > 1 && (\n''',
              '''        </div>\n\n        {result.integrity_status === "flagged" && (\n          <section className="no-print mb-6 rounded-2xl border border-amber-300/25 bg-amber-300/10 px-5 py-4 text-sm leading-6 text-amber-100">\n            <div className="flex items-start gap-3"><ShieldCheck className="mt-0.5 h-5 w-5 shrink-0 text-amber-300"/><div><b>Hasil tersimpan · sedang ditinjau Fair Play.</b><p className="mt-1 text-amber-100/75">Percobaan ini sementara tidak mengubah Ranking. Jika Anda sudah memiliki skor verified sebelumnya, skor tersebut tetap aman di leaderboard.</p></div></div>\n          </section>\n        )}\n\n        {Array.isArray(data.attempts) && data.attempts.length > 1 && (\n''')

          # Anonymous smoke should not chase auth redirects, and should cover mobile + desktop.
          Path("tests/browser-smoke.mjs").write_text('''import { chromium } from "playwright"\nimport AxeBuilder from "@axe-core/playwright"\n\nconst base="http://127.0.0.1:4173"\nconst routes=["/battle/","/quick-battle/","/account/","/pvp/","/help/","/latihan-skd/","/latihan-tiu/","/simulasi-tiu/","/global-chat/","/history-ranking/","/messages/"]\nconst viewports=[{width:390,height:844,name:"mobile"},{width:1440,height:1000,name:"desktop"}]\nconst browser=await chromium.launch({headless:true})\nconst pageErrors=[]\nconst accessibility=[]\nfor(const viewport of viewports){\n  const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}})\n  const page=await context.newPage()\n  page.on("pageerror",e=>pageErrors.push(`${viewport.name}: ${String(e)}`))\n  for(const route of routes){\n    const r=await page.goto(base+route,{waitUntil:"domcontentloaded",timeout:25000})\n    if(!r||r.status()>=400)throw new Error(`${viewport.name} ${route} HTTP ${r?.status()}`)\n    await page.waitForTimeout(120)\n    const text=(await page.locator("body").innerText()).trim()\n    if(text.length<20)throw new Error(`${viewport.name} ${route} rendered empty`)\n    const horizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4)\n    if(horizontalOverflow)throw new Error(`${viewport.name} ${route} horizontal overflow`)\n    const result=await new AxeBuilder({page}).withTags(["wcag2a","wcag2aa","wcag21a","wcag21aa"]).analyze()\n    const severe=result.violations.filter(v=>v.impact==="serious"||v.impact==="critical")\n    if(severe.length)accessibility.push(`${viewport.name} ${route}: ${severe.map(v=>`${v.id}(${v.nodes.length})`).join(", ")}`)\n  }\n  await context.close()\n}\nawait browser.close()\nif(pageErrors.length)throw new Error(`browser page errors: ${pageErrors.join(" | ")}`)\nif(accessibility.length)throw new Error(`serious accessibility violations: ${accessibility.join(" | ")}`)\nconsole.log(`smoke + accessibility ok: ${routes.length} routes x ${viewports.length} viewports`)\n''')

          # CSP: keep framework-required inline bootstrap but block inline event attributes explicitly.
          rep("public/_headers",
              "  Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://efndozplpwyemzgqfnep.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'\n",
              "  Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://efndozplpwyemzgqfnep.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests\n")

          print("hardening patches applied")
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Commit hardening pass
        run: |
          git config user.name "alzava-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app components tests public/_headers
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden ALZAVA sessions and focus flows [hardening-v1]"
          git push
