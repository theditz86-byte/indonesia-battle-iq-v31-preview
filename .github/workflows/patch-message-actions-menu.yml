name: Patch Message Actions Menu

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-message-actions-menu.yml"

permissions:
  contents: write

jobs:
  patch-message-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch message actions dropdown
        run: python .github/scripts/patch-message-actions-menu.py
      - name: Commit message actions fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/private-messages.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move message delete actions into dropdown"
          git push
