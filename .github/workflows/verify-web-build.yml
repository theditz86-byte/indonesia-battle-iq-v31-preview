name: Verify ALZAVA web build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-web-build.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run build
