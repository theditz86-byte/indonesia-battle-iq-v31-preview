name: Apply season history UI
on:
  push:
    paths:
      - ".github/workflows/apply-season-history-ui.yml"
      - "scripts/patch-season-history-ui.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply UI patch
        run: python scripts/patch-season-history-ui.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Commit UI changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx components/site-navbar.tsx components/podium.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add manual season controls and History Ranking menu"
          git pull --rebase origin main
          git push origin HEAD:main
