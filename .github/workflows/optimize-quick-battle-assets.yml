name: Apply Private Message Reply

on:
  push:
    paths:
      - '.github/workflows/optimize-quick-battle-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reply patch
        run: python .github/scripts/add-private-message-reply.py

      - name: Commit reply feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/private-messages.tsx lib/social.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add reply to private messages"
          git push origin HEAD:main
