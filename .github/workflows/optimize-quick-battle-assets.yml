name: Optimize Quick Battle assets

on:
  push:
    paths:
      - '.github/workflows/optimize-quick-battle-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate optimized WebP assets
        run: python scripts/optimize_quick_battle_assets.py

      - name: Show generated sizes
        run: |
          ls -lh public/qb-webp
          du -ch public/qb-webp/*.webp | tail -1

      - name: Commit optimized assets and WebP paths
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/qb-webp)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/qb-webp components/quick-battle public/_headers
          git commit -m "Optimize Quick Battle artwork to WebP"
          git push origin HEAD:main
