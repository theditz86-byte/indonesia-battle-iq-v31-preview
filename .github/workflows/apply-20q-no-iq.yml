name: Apply 20-question no-IQ update
on:
  push:
    paths:
      - ".github/workflows/apply-20q-no-iq.yml"
      - "scripts/patch-20q-no-iq.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply frontend patch
        run: python scripts/patch-20q-no-iq.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate public copy
        shell: bash
        run: |
          ! grep -n "30 soal" app/battle-test/page.tsx
          ! grep -n "15 menit" app/battle-test/page.tsx
          ! grep -n "Estimasi IQ Battle" app/result/page.tsx
          ! grep -n "ESTIMASI IQ BATTLE" app/result/page.tsx
          ! grep -n "IQ Battle" app/result/page.tsx
          ! grep -n "IQ Battle" app/account/results/page.tsx
      - name: Commit frontend update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/battle-test/page.tsx app/result/page.tsx app/account/results/page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use 20-question Battle Point format and remove visible IQ"
          git pull --rebase origin main
          git push origin HEAD:main
