name: Apply Open Beta Growth Patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-open-beta-growth.mjs
      - .github/workflows/apply-open-beta-growth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-open-beta-growth.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/battle-test/page.tsx app/result/page.tsx app/daily-training/page.tsx
          git commit -m "feat: launch Open Beta ranked cadence and TIU learning"
          git push
