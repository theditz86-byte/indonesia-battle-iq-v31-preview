name: Web Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply private message reply patch
        run: python .github/scripts/add-private-message-reply.py

      - name: Commit private message reply patch if needed
        run: |
          git config user.name "alzava-reply-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/private-messages.tsx lib/social.ts
          git diff --cached --quiet && true || (git commit -m "Add reply to private messages" && git push)

      - name: Apply PVP polling hardening
        shell: python
        run: |
          from pathlib import Path
          p=Path("components/pvp-arena.tsx")
          s=p.read_text()
          old='''    if(matchId){void loadState(matchId);const t=window.setInterval(()=>{if(document.visibilityState==="visible")void loadState(matchId)},2500);return()=>window.clearInterval(t)}
    const t=window.setInterval(()=>{if(document.visibilityState==="visible")void loadLobby(true)},8000);return()=>window.clearInterval(t)'''
          new='''    const refresh=()=>{if(document.visibilityState!=="visible")return;if(matchId)void loadState(matchId);else void loadLobby(true)}
    if(matchId)void loadState(matchId)
    const t=window.setInterval(refresh,matchId?4000:15000)
    window.addEventListener("focus",refresh)
    document.addEventListener("visibilitychange",refresh)
    return()=>{window.clearInterval(t);window.removeEventListener("focus",refresh);document.removeEventListener("visibilitychange",refresh)}'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif "2500" in s or "8000" in s:
              raise SystemExit("PVP polling block changed unexpectedly")
      - name: Commit PVP patch if needed
        run: |
          git config user.name "alzava-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/pvp-arena.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: reduce PVP polling load"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test, typecheck and build
        run: npm run check
