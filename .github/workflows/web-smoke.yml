name: Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve static export and smoke routes
        env:
          ALZAVA_E2E_TOKEN: ${{ secrets.ALZAVA_E2E_TOKEN }}
        run: |
          python3 -m http.server 4173 -d out >/tmp/alzava-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/authenticated-smoke.mjs
