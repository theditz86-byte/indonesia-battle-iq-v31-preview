name: Fix Admin Login Routing
on:
  push:
    paths:
      - '.ops/fix_admin_login_routing.py'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .ops/fix_admin_login_routing.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "ALZAVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/account/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: route admin credentials to admin login"
          git pull --rebase origin main
          git push origin HEAD:main
