[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[redirects]]
  from = "https://indonesia-battle-iq.netlify.app/*"
  to = "https://alzava-battle-iq.vercel.app/:splat"
  status = 301
  force = true
